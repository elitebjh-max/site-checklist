<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>건축물관리점검 현장 체크리스트</title>
<style>
  :root{
    --bar1:#000000; --bar2:#989998; --bar3:#BEBFBE; --bar4:#F1F2F1;
    --label:#D7D8D7; --accent:#1a1a1a; --line:#c9c9c9;
    --ok:#2e7d32; --warn:#c62828; --na:#757575;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',system-ui,sans-serif; background:#f4f4f4; color:#111; font-size:15px;
       padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);}
  header{position:sticky; top:0; z-index:50; background:#fff; border-bottom:2px solid #000; padding-top:env(safe-area-inset-top);}
  .hbar{display:flex; height:5px;}
  .hbar div{flex:1;}
  .hbar div:nth-child(1){background:var(--bar1);} .hbar div:nth-child(2),.hbar div:nth-child(3),.hbar div:nth-child(4){background:var(--bar2);} .hbar div:nth-child(5){background:var(--bar3);} .hbar div:nth-child(6){background:var(--bar4);}
  .htop{display:flex; align-items:center; justify-content:space-between; padding:8px 12px;}
  .htop h1{font-size:16px; margin:0; font-weight:700;}
  .htop .sub{font-size:11px; color:#666;}
  .progress{padding:0 12px 8px;}
  .pbar{height:8px; background:#e2e2e2; border-radius:4px; overflow:hidden;}
  .pfill{height:100%; background:linear-gradient(90deg,#444,#000); width:0%;}
  .ptext{font-size:11px; color:#555; margin-top:3px; display:flex; justify-content:space-between;}
  main{max-width:760px; margin:0 auto; padding:10px 10px calc(90px + env(safe-area-inset-bottom));}
  details.sec{background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; overflow:hidden;}
  details.sec>summary{list-style:none; cursor:pointer; padding:11px 12px; background:var(--label); font-weight:700; font-size:14.5px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); gap:8px;}
  details.sec>summary::-webkit-details-marker{display:none;}
  .cnt{font-size:12px; font-weight:400; color:#444; background:#fff; border-radius:10px; padding:2px 8px; border:1px solid #bbb; white-space:nowrap;}
  .cnt.done{background:#e6f4e6; color:var(--ok); border-color:var(--ok);}
  .ref{font-size:10.5px; font-weight:400; color:#555; display:block;}
  .item{border-bottom:1px solid #e5e5e5; padding:10px 12px;}
  .item:last-child{border-bottom:none;}
  .ititle{font-weight:700; font-size:14px; display:flex; justify-content:space-between; gap:8px; align-items:baseline;}
  .ititle .no{color:#0b57a4; margin-right:4px;}
  .ititle .law{font-size:11px; color:#777; font-weight:400; white-space:nowrap;}
  .q{margin:8px 0 2px;}
  .qtext{font-size:13.5px; margin-bottom:5px; color:#222;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{border:1px solid #aaa; border-radius:16px; padding:5px 12px; font-size:13px; background:#fff; cursor:pointer; user-select:none;}
  .chip.sel{background:#111; color:#fff; border-color:#111; font-weight:700;}
  .chip.sel.bad{background:var(--warn); border-color:var(--warn);}
  .chip.sel.na{background:var(--na); border-color:var(--na);}
  .cmp{background:#f4f8ff; border:1px solid #c6d8f0; border-radius:7px; padding:7px 9px; margin-top:8px;}
  .cmp .qtext{font-size:12.5px; font-weight:700; color:#0b57a4; margin-bottom:5px;}
  .cntrow{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .cntrow label{font-size:12.5px; color:#444; font-weight:700;}
  .cntrow input{width:80px; border:1px solid #bbb; border-radius:6px; padding:6px; font:inherit; font-size:13px; text-align:center;}
  textarea{width:100%; border:1px solid #bbb; border-radius:6px; padding:7px; font:inherit; font-size:13px; min-height:34px; resize:vertical; margin-top:6px; background:#fcfcfc;}
  input[type=text],input[type=date],input[type=number]{width:100%; border:1px solid #bbb; border-radius:6px; padding:8px; font:inherit; font-size:14px; background:#fcfcfc;}
  .field{margin-bottom:9px;}
  .field label{display:block; font-size:12px; font-weight:700; color:#444; margin-bottom:3px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; padding:10px 12px;}
  .grid2 .full{grid-column:1/3;}
  .subhead{padding:7px 12px; font-size:12.5px; font-weight:700; color:#fff; background:#666;}
  .photos{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .ph{position:relative; width:74px;}
  .ph img{width:74px; height:74px; object-fit:cover; border-radius:6px; border:1px solid #ccc; display:block;}
  .ph .del{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:#c62828; color:#fff; border:none; font-size:12px; line-height:1; cursor:pointer;}
  .ph input{width:74px; font-size:10px; border:none; border-bottom:1px solid #ddd; background:transparent; padding:2px 0;}
  .addph{position:relative; display:inline-flex; align-items:center; gap:5px; margin-top:8px; margin-right:6px; font-size:12.5px; border:1px dashed #888; border-radius:6px; padding:6px 10px; background:#fafafa; cursor:pointer;}
  .memo-label{font-size:11.5px; color:#666; margin-top:6px;}
  footer{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #ccc; display:flex; gap:8px; z-index:50;
         padding:8px calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));}
  body.kb footer{display:none;}  /* 모바일 키보드 표시 중에는 하단 버튼 숨김 */
  footer button{flex:1; padding:11px 4px; font:inherit; font-size:13.5px; font-weight:700; border-radius:8px; border:1px solid #333; background:#fff; cursor:pointer;}
  footer button.primary{background:#111; color:#fff;}
  .note{font-size:12px; color:#555; background:#fffbe6; border:1px solid #e6d87a; border-radius:6px; padding:8px 10px; margin:10px 12px;}
  .tip{font-size:12px; color:#8a6d00; background:#fff9e0; border-radius:5px; padding:5px 8px; margin-top:5px;}
  .toggle-row{padding:10px 12px; border-bottom:1px solid #e5e5e5;}
  .toggle-row label{font-size:13.5px; font-weight:700;}
  .hidden{display:none!important;}
  /* iOS Safari: display:none 인 file input 은 label 탭이 동작하지 않는 경우가 있어 시각적으로만 숨김 */
  .vh{position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); border:0; opacity:0;}
  .missing{outline:2px solid var(--warn); outline-offset:-2px; border-radius:4px;}
  @media (max-width:480px){ .grid2{grid-template-columns:1fr;} .grid2 .full{grid-column:1;} }
  @media (pointer:coarse){
    .chip{padding:7px 14px; font-size:14px;}
    .addph{padding:8px 12px; font-size:13.5px;}
    .ph .del{width:26px; height:26px; font-size:15px; top:-8px; right:-8px;}
  }
  /* 사진 크게 보기 */
  #lightbox{position:fixed; inset:0; z-index:900; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center;
            padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  #lightbox img{max-width:100%; max-height:100%; object-fit:contain;}
  #lightbox .close{position:absolute; top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right)); width:40px; height:40px; border-radius:50%;
            border:none; background:#fff; color:#000; font-size:22px; line-height:1;}
  /* 파일 저장 준비 안내 (iOS 공유시트 재시도용) */
  .modal{position:fixed; inset:0; z-index:950; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal .box{background:#fff; border-radius:12px; padding:18px; max-width:360px; width:100%; text-align:center;}
  .modal .box p{margin:0 0 14px; font-size:14px;}
  .modal .box button{display:block; width:100%; margin-top:8px; padding:12px; font:inherit; font-weight:700; border-radius:8px; border:1px solid #333; background:#fff;}
  .modal .box button.primary{background:#111; color:#fff;}
  /* 매뉴얼 세부점검표 카드 */
  .mcard .ititle{align-items:center;}
  .mlaw{font-size:11px; color:#777; margin-top:3px;}
  .hrow{display:grid; grid-template-columns:1fr 1.4fr; gap:8px; margin-top:8px;}
  .hcell{background:#f4f8ff; border:1px solid #c6d8f0; border-radius:7px; padding:7px 9px;}
  .mlabel{font-size:12.5px; font-weight:700; color:#0b57a4; margin-bottom:5px;}
  .msect{font-size:12.5px; font-weight:700; color:#fff; background:#666; border-radius:5px; padding:4px 9px; margin:12px 0 6px; display:flex; justify-content:space-between; align-items:center;}
  .scount{font-weight:400; font-size:11.5px; background:#fff; color:#c62828; border-radius:9px; padding:1px 8px;}
  .scount:empty{display:none;}
  .sub{border:1px solid #ddd; border-radius:8px; padding:8px 10px; margin-bottom:8px; background:#fcfcfc;}
  .subname{font-size:13.5px; font-weight:700; margin-bottom:5px;}
  .subres{background:#fff; border:1px solid #e5e5e5; border-radius:6px; padding:5px 7px;}
  .mini{font-size:11px; color:#666; margin-bottom:3px;}
  .sline2{margin-top:7px; padding-left:6px; border-left:3px solid #ddd;}
  .ltitle{font-size:12.5px; color:#222; margin-bottom:4px;}
  .lnote{font-size:11px; color:#777; margin:-2px 0 4px;}
  .subfoot{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:8px; font-size:12.5px; color:#333;}
  .subfoot label{font-weight:700;}
  .subfoot input.cntin{width:64px; border:1px solid #bbb; border-radius:6px; padding:5px; font:inherit; text-align:center;}
  .sinfo2{color:#555;}
  .sugg{font:inherit; font-size:12px; font-weight:700; color:#0b57a4; background:#eaf2fd; border:1px solid #9cbce6; border-radius:14px; padding:4px 10px; cursor:pointer;}
  .status{font-size:13px; line-height:1.9; background:#fff; border:1px solid #e5e5e5; border-radius:7px; padding:6px 8px;}
  .sline.sgrp{font-weight:700; color:#0b57a4; margin-top:4px;}
  .sbox{display:inline-block; border:1px solid #aaa; border-radius:5px; padding:1px 8px 1px 22px; margin:2px 3px; position:relative; cursor:pointer; background:#fff; line-height:1.6; user-select:none; -webkit-user-select:none;}
  .sbox::before{content:''; position:absolute; left:6px; top:50%; width:10px; height:10px; margin-top:-6px; border:1.5px solid #777; border-radius:2px; background:#fff;}
  .sbox.on{background:#111; color:#fff; border-color:#111; font-weight:700;}
  .sbox.on::before{content:'✓'; border-color:#fff; background:#111; color:#fff; font-size:10px; line-height:10px; text-align:center;}
  input.blank{width:72px; border:none; border-bottom:1.5px solid #888; background:#fffbe6; font:inherit; font-size:13px; padding:1px 4px; margin:0 3px; text-align:center; border-radius:0;}
  details.crit{margin-top:10px; border:1px solid #e6d87a; border-radius:7px; background:#fffdf3;}
  details.crit > summary{cursor:pointer; padding:8px 10px; font-size:13px; font-weight:700; color:#6b5600; list-style:none; display:flex; justify-content:space-between; align-items:center;}
  details.crit > summary::-webkit-details-marker{display:none;}
  details.crit > summary::after{content:'펼치기 ▾'; font-size:11.5px; font-weight:400; color:#8a6d00;}
  details.crit[open] > summary::after{content:'접기 ▴';}
  .ccnt{font-size:11.5px; font-weight:400; color:var(--ok); margin-left:6px; flex:1;}
  .cline{font-size:12.5px; line-height:1.55; padding:2px 10px; color:#333;}
  .cline.head{font-weight:700; color:#111; margin-top:5px;}
  .cline.chk{position:relative; padding-left:32px; cursor:pointer; margin:2px 0;}
  .cline.chk::before{content:''; position:absolute; left:12px; top:5px; width:12px; height:12px; border:1.5px solid #b59a1e; border-radius:3px; background:#fff;}
  .cline.chk.on{color:#777;}
  .cline.chk.on::before{content:'✓'; background:var(--ok); border-color:var(--ok); color:#fff; font-size:10px; line-height:12px; text-align:center;}
  details.crit .cline:last-child{padding-bottom:8px;}
  .mcard textarea{margin-top:4px;}
  @media (max-width:560px){ .hrow{grid-template-columns:1fr;} }
  /* 프로젝트 */
  .projbtn{display:flex; align-items:center; gap:8px; width:calc(100% - 24px); margin:0 12px 8px; padding:8px 10px; font:inherit; font-size:14px;
           background:#f1f2f1; border:1px solid #bbb; border-radius:8px; cursor:pointer; text-align:left; color:#111;}
  .projbtn .pl{font-size:12px; color:#555; white-space:nowrap;}
  .projbtn #projname{flex:1; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .projbtn .pc{font-size:12px; color:#0b57a4; white-space:nowrap;}
  .modal .pbox{max-width:520px; text-align:left; padding:0; max-height:calc(100vh - 32px); display:flex; flex-direction:column; overflow:hidden;}
  .pbox .phead{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid #ddd; font-size:15px;}
  .pbox .phead .x{display:inline; width:auto; margin:0; padding:0 6px; border:none; background:none; font-size:24px; line-height:1;}
  .pbox .plist{overflow:auto; -webkit-overflow-scrolling:touch; flex:1;}
  .pitem{display:flex; gap:8px; align-items:center; padding:10px 14px; border-bottom:1px solid #eee;}
  .pitem.cur{background:#f4f8ff;}
  .pinfo{flex:1; min-width:0;}
  .pname{font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .psub{font-size:11.5px; color:#666; margin-top:2px;}
  .pbtns{display:flex; gap:5px; flex-shrink:0;}
  .modal .box .pbtns button{display:inline-block; width:auto; margin:0; padding:7px 9px; font-size:12.5px;}
  .modal .box .pbtns button.on{background:#e6f4e6; color:var(--ok); border-color:var(--ok);}
  .modal .box .pbtns button.danger{color:var(--warn); border-color:#e0a0a0;}
  .pbox .pact{display:flex; gap:8px; padding:10px 14px; border-top:1px solid #ddd;}
  .modal .box .pact button{margin:0;}
  .pbox .pfoot{font-size:11px; color:#777; padding:0 14px 12px;}
  .pbox .psave{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 14px 8px; font-size:12px; color:#444;}
  .modal .box .psave button{display:inline-block; width:auto; margin:0; padding:5px 10px; font-size:12px;}
  /* 저장 위치 설정 */
  .modal .sbox{max-width:460px; text-align:left; padding:0; max-height:calc(100vh - 32px); overflow:auto;}
  .sbox .phead{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid #ddd; font-size:15px;}
  .sbox .phead .x{display:inline; width:auto; margin:0; padding:0 6px; border:none; background:none; font-size:24px; line-height:1;}
  .sbody{padding:12px 14px 14px;}
  .sinfo{font-size:12.5px; color:#555; line-height:1.55; margin-bottom:10px;}
  .sopt{display:block; border:1px solid #ccc; border-radius:8px; padding:10px 12px; margin-top:8px; font-size:13.5px; line-height:1.5; cursor:pointer;}
  .sopt.on{border-color:#111; background:#f7f7f7;}
  .shint{font-size:12px; color:#666;}
  .srow{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .sdir{flex:1; font-size:12.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .modal .box .srow button{display:inline-block; width:auto; margin:0; padding:6px 12px; font-size:12.5px;}
  #toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom)); z-index:960;
         max-width:calc(100% - 32px); background:#111; color:#fff; font-size:13px; padding:10px 14px; border-radius:8px;
         box-shadow:0 4px 14px rgba(0,0,0,.25); word-break:break-all;}
  @media (max-width:420px){ .pitem{flex-wrap:wrap;} .pbtns{width:100%; justify-content:flex-end;} }
  /* 라이선스 잠금 화면 */
  body.locked header, body.locked main, body.locked footer{display:none!important;}
  #lock{position:fixed; inset:0; z-index:1000; background:#f4f4f4; overflow:auto; -webkit-overflow-scrolling:touch;
        padding:calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));}
  #lock .card{max-width:440px; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  #lock .body{padding:18px;}
  #lock h2{margin:0 0 4px; font-size:18px;}
  #lock .co{font-size:12px; color:#666; margin-bottom:14px;}
  #lock .lbl{font-size:12px; font-weight:700; color:#444; margin:14px 0 5px;}
  #lock .devid{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:21px; font-weight:700; letter-spacing:1px; background:#f1f2f1;
        border:1px solid #ccc; border-radius:8px; padding:10px; text-align:center; user-select:all; -webkit-user-select:all;}
  #lock .row{display:flex; gap:8px; margin-top:8px;}
  #lock button{flex:1; padding:11px 6px; font:inherit; font-size:14px; font-weight:700; border-radius:8px; border:1px solid #333; background:#fff; color:#111; cursor:pointer;}
  #lock button.primary{background:#111; color:#fff;}
  #lock textarea{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:16px; min-height:90px; word-break:break-all;}
  #lock .msg{font-size:13px; margin-top:10px; min-height:18px; font-weight:700;}
  #lock .msg.err{color:var(--warn);} #lock .msg.ok{color:var(--ok);}
  #lock .help{font-size:12px; color:#555; line-height:1.55; margin-top:14px; background:#fffbe6; border:1px solid #e6d87a; border-radius:6px; padding:8px 10px;}
</style>
</head>
<body class="locked">
<div id="lock"></div>
<header>
  <div class="hbar"><div></div><div></div><div></div><div></div><div></div><div></div></div>
  <div class="htop">
    <h1>건축물관리점검 현장 체크리스트</h1>
    <span class="sub">우림구조엔지니어링</span>
  </div>
  <button class="projbtn" onclick="openProjects()"><span class="pl">📁 프로젝트</span><span id="projname"></span><span class="pc">변경 ▾</span></button>
  <div class="progress">
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
    <div class="ptext"><span id="ptext">0 / 0 항목</span><span id="savestat"></span></div>
  </div>
</header>
<main id="main"></main>
<footer>
  <button onclick="showMissing()">미작성 확인</button>
  <button onclick="exportJSON()">JSON 저장</button>
  <button onclick="exportPhotoZip()">사진 ZIP</button>
  <button class="primary" onclick="exportReport()">요약보고서(HTML)</button>
</footer>
<input type="file" id="importFile" accept=".json,application/json" class="vh" onchange="importJSON(event)">

<script>
/* ============================================================
   번호체계는 표준 세부점검표(3.1.1~3.5.10)와 1:1 대응.
   각 항목 카드 = 보고서 "3장 점검세부항목별 점검내용" 1개 페이지
                = 별지 제2호 서식의 소항목 1칸.
   ============================================================ */

/* ====== 선택지 정의 ====== */
const CH = {
  A: ['적합','부적합','도면없음','해당없음'],   /* 법규유지형 — 별지2 기입 시 '도면없음'은 해당없음(-) 처리 */
  A3:['적합','부적합','해당없음'],             /* 별지2와 동일 3택 (내진·화재 마감재 등) */
  B: ['양호','보통','미흡','불량','해당없음'],
  C: ['인증','재인증','만료','해당없음'],

 긴급한 조치가 필요한 경우\n(2) 개선방안에 대한 의견\n▸ 범죄예방 건축기준 고시 (건축물의 범죄예방 설계 가이드라인 포함)를 적용한 부분이 유지관리가 되지 않아 해당 기준에 부적합한 경우, 해당 기준을 적용하도록 제안\n(3) 점검세부항목별 합계점수에 따라 점검 판단결과를 ‘양호’,‘보통’,‘미흡’,‘불량’,‘해당없음’으로 표기함\n▸ 양호 : 9점 초과 ▸ 보통 : 7점 초과 9점 이하 ▸ 미흡 : 5점 초과 7점 이하 ▸ 불량 : 5점 이하\n▸ 해당없음 : 대상건축물이 적용대상이 아닌 경우 (해당없음 사유 및 근거를 반드시 제시)"},{"no":"3.1.16","t":"세부기준 1-1","small":"세부기준 1","law":"건축법 제53조의2, 건축법시행령 제63조의6, 범죄예방 건축기준 고시 제3장 건축물의 용도별 범죄예방 기준","subs":[{"n":"범죄예방 기준 유지 여부 (100세대 이상 아파트)","pts":50,"cnt":null,"o":["양호","보통","미흡","불량","해당없음"],"L":[{"t":"범죄예방세부기준 유지 여부","pts":50,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]}]}],"status":"1) 범죄예방세부기준 부적합 유형 (아래 각 유형 중 부적합 항목 해당란에 표기)\n  □ 단지 출입구 영역의 위계 명확성 및 용이한 자연적 감시  - 출입구 수 :\n  □ 담장 [사각지대 및 고립지대 미발생, 투시형 담장, 울타리용 밀생수종(h:1~1.5m) 일정간격 식재]\n  □ 부대 및 복리시설(접근과 자연적 감시의 용이)\n  □ 어린이 놀이터(빈번한 통행 또는 각 세대조망 가능 위치 배치 및 주변 경비실 또는 영상정보처리 기기 설치)\n  □ 경비실 (각 방향 조망확보, 주변조경 시야 미차단, 고립지역 상시 관망 영상정보처리기기 설치)\n  □ 주차장 (사각지대 미 발생, 적법한 조명 및 영상정보처리 기기 설치, 25m마다 비상벨 설치, 출입구 인접지역 여성전용주차구획 설치)\n  □ 조경 (주거침입에 이용되지 않도록 식재)\n  □ 건축물 출입구 (접근통제시설 설치, 용이한 자연적 감시 또는 반사경 등 대체시설 설치,\n     주변 대비 밝은조명 설치, 영상정보처리기기 설치)\n  □ 세대현관문, 창문 (「범죄예방 건축기준 고시」 별표1 기준에 적합한 침입방어성능 제품 설치)\n  □ 승강기, 복도, 계단 등 [지하층 (주차장 연결통로에 한함) 및 1층 승강장, 옥상 출입구, 승강기 내부의 영상정보처리기기 설치, 계단실에 창호 및 1개소 이상의 영상정보처리기기  설치]\n  □ 외벽 및 수직배관 (침입불가 구조로 설치)\n  □ 건물측면, 뒷면, 사각지대 및 주차장에 조명 설치, 조명 설치 불가피시 대체시설(반사경)설치\n  □ 전기,가스,수도 등 검침용 기기의 외부설치 또는 외부에서 사용량 검침 가능\n  □ 세대 창문의 방범시설은– 화재시 피난에 용이한 개폐구조","crit":"1) 세부항목에 표기한 점수[배점 × 각 항목별 가중치(1.0, 0.8, 0.6, 0.4)]를 합산하여 기입함\n2) ‘세부항목 점검현황’의 부적합 유형이 있는 경우 해당란에 표기하고 합계 건수를 기입하며, 표기 건수 (양호 : 0-3건, 보통 : 4-7건, 미흡 : 8-11건, 불량 : 12-14건)에 따라 ‘세부항목 점검 결과’의 ‘양호’,‘보통’,‘미흡’,‘불량’ 중 해당란에 표기함\n3) ‘해당없음’의 경우, 건수/점수에 ( - ) 로 표기함\n4) 점검기준\n▸ 점검 전 대상 건축물의 건축허가일, 사용승인일 확인 및 해당 점검항목의 관련법규를 검토하여, 적용 대상 여부 및 점검범위를 확인한다.\n(1) 세부항목 (범죄예방세부기준 유지 여부)\n▸ 양호 (0-3건) : 건축물의 각 부위가 범죄예방세부기준에 대부분 적합하고, 점검 결과 정기적인 유지 보수를 실시하여 관리가 우수한 경우\n▸ 보통 (4-7건) : 건축물의 각 부위가 범죄예방세부기준에 일부 적합하고, 점검 결과 관리 소  : 화장실/주방 급수기구의 2리터 급수시간이 12초 이하이고, 점검 결과 정기적인 유지 보수로 관리가 우수한 경우\n▸ 보통 : 화장실/주방 급수기구의 2리터 급수시간이 12초 초과 ~ 20초 이하이고, 점검 결과 성능저하가 없는 경우\n▸ 미흡 : 화장실/주방 급수기구의 2리터 급수시간이 20초를 초과하고 점검 결과 노후화 또는 관리소홀 등으로 성능 저하가 있어 개선이 필요한 경우\n▸ 불량 : 화장실/주방 급수기구의 2리터 급수시간이 20초를 초과하고 점검 결과 노후화 또는 관리소홀 등으로 성능 저하가 매우 심각하여 긴급한 조치가 필요한 경우\n(2) 세부항목(정기청소)\n▸ 양호 : 저수조 (고가수조 포함)의 청소를 6개월 마다 실시하며, 점검 결과 관리가 우수한 경우\n▸ 보통 : 저수조 (고가수조 포함)의 청소를 6개월 마다 실시하며, 점검 결과 성능저하가 없는 경우\n▸ 미흡 : 저수조 (고가수조 포함)의 청소를 6개월 마다 실시하지 않고 점검 결과 노후화 또는 관리소홀 등으로 성능 저하가 있어 개선이 필요한 경우\n▸ 불량 : 저수조 (고가수조 포함)의 청소를 6개월 마다 실시하지 않고 점검 결과 노후화 또는 관리소홀 등으로 성능 저하가 매우 심각하여 긴급한 조치가 필요한 경우\n(3) 세부항목(급수 펌프 및 밸브 작동성)\n▸ 양호 : 급수펌프, 밸브 작동 시 이상소음이 없고, 정기적인 점검으로 관리가 우수한 경우\n▸ 보통 : 급수펌프, 밸브 작동 시 이상소음이 없고, 점검 결과 성능저하가 없는 경우\n▸ 미흡 : 급수펌프, 밸브 작동 시 이상소음이 있거나, 점검 결과 노후화 또는 관리소홀 등으로 성능 저하가 있어 개선이 필요한 경우\n▸ 불량 : 급수펌프, 밸브 작동 시 이상소음이 매우 크거나, 점검 결과 노후화 또는 관리소홀 등으로 성능저하가 매우 심각하여 긴급한 조치가 필요한 경우\n(4) 점검 항목\n▸ 화장실 및 주방 내 위생기구 수압 및 외관상태 ▸ 급수탱크 및 펌프 등의 청소 및 작동상태\n▸ 저수조 및 고가수조 수위조절장치 작동상태 ▸ 급수배관 부착, 보온 및 누수상태\n(5) 기계설비 유지관리 실시 여부\n▸ 각 점검소항목에 대한 「기계설비 유지관리 기준」 등에 따른 유지관리 시 점검생략이 가능하며, 근거를 첨부한다\n(6) 개선방안에 대한 의견\n▸ 지속적인 관리와 점검방법 등을 제안하고 개선이 필요한 부분은 보완 및 교체 등을 제안\n▸ 육안으로 점검할 수 없는 부분(은폐 및 매설 부분)을 관리주체가 점검을 요구할 경우에는 별도의 비용으로 정밀점검할 것을 제안\n(7) 점검세부항목별 합계점수에 따라 점검 판단결과를 ‘양호’,‘보통’,‘미흡’,‘불량’,‘해당없음’으로 표기함\n(배점 20점) ▸ 양호 : 18점 초과 ▸ 보통 : 14점 초과 18점 이하  ▸ 미흡 : 10점 초과 14점 이하 ▸ 불량 : 10점 이하\n(배점 10점) ▸ 양호 : 9점 초과 ▸ 보통 : 7점 초과 9점 이하  ▸ 미흡 : 5점 초과 7점 이하 ▸ 불량 : 5점 이하\n▸ 해당없음 : 대상건축물이 적용대상이 아닌 경우 (해당없음 사유 및 근거를 반드시 제시)"},{"no":"3.2.2","t":"배수성능","small":"배수성능","law":"건축법 제62조, 건축법 시행령 제87조제2항, 건축물의 설비기준 등에 관한 규칙 제17조(배관설비)제2항","subs":[{"n":"배수상태 유지 여부","pts":30,"cnt":null,"o":["양호","보통","미흡","불량","해당없음"],"L":[{"t":"세면대 배수","pts":10,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]},{"t":"세면대하부 배수구","pts":10,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]},{"t":"주방싱크 배수","pts":10,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["  환기설비의 내부 물맺힘 등 결로발생 여부\n▸ 결로를 방지할 수 있는 단열(보온) 여부\n▸ 덕트 내부(자연환기설비의 경우, 바깥공기 유입구 및 경로)의 주기적인 청소 여부(1회/년)\n(4) 공기조화설비의 점검 항목\n▸ 공기조화설비 설치위치 유지여부 ▸ 공기조화설비 및 배관의 열화 등 손상여부 ▸ 공기조화설비의 작동 가능여부\n▸ 공기여과기의 점검구 적정여부\n(5) 환기구의 점검 항목\n▸ 바닥으로부터 2미터 이상 높이에 설치 여부(안전펜스 등으로 접근을 차단한 경우 제외)\n▸ 지지구조 철물 및 연결재의 부식, 탈락 여부 ▸ 덮개의 변형 여부 ▸ 추락방지시설 설치 및 관리 여부\n(6) 기계설비 유지관리 실시 여부\n▸ 각 점검소항목에 대한 「기계설비 유지관리 기준」 등에 따른 유지관리 시 점검생략이 가능하며, 근거를 첨부한다\n(7) 개선방안에 대한 의견\n▸ ‘환기설비의 성능유지를 위한 점검항목’의 내용에 적합한 지속적인 관리와 점검방법 등을 제안하고 개선이 필요한 부분은 보완 및 교체 등을 제안\n▸ ‘환기구의 점검 항목’ 중 안전이 확보되지 아니한 항목에 대해서는 필요한 부분의 교체 또는 보완을 제안\n▸ 환기성능 등 실내 공기질의 유해 물질 및 환기구 구조안전의 정밀점검을 요구할 경우에는 별도의 비용으로 정밀점검할 것을 제안\n(8) 점검세부항목별 합계점수에 따라 점검 판단결과를 ‘양호’,‘보통’,‘미흡’,‘불량’,‘해당없음’으로 표기함\n▸ 양호 : 27점 초과 ▸ 보통 : 21점 초과 27점 이하 ▸ 미흡 : 15점 초과 21점 이하 ▸ 불량 : 15점 이하\n▸ 해당없음 : 대상건축물이 적용대상이 아닌 경우 (해당없음 사유 및 근거를 반드시 제시)"},{"no":"3.2.6","t":"피뢰성능","small":"피뢰성능","law":"건축법 제62조, 건축법 시행령 제87조제2항, 건축물의 설비기준 등에 관한 규칙 제20조","subs":[{"n":"피뢰설비 성능 유지 여부","pts":20,"cnt":null,"o":["양호","보통","미흡","불량","해당없음"],"L":[{"t":"부식(열화) 및 손상","pts":20,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]}]}],"status":"◦피뢰설비\n - 정기점검 및 교체 : □ 점검 □ 교체 □ 해당없음\n - 점검주기 ( ) 개월 또는 교체시기 : ( ) 년","crit":"1) 세부항목에 표기한 점수[배점 × 각 항목별 가중치(1.0, 0.8, 0.6, 0.4)]를 합산하여 기입함\n2) ‘해당없음’의 경우, 점수에 ( - ) 로 표기함\n3) 점검기준\n▸ 점검 전 대상 건축물의 건축허가일, 사용승인일 확인 및 해당 점검항목의 관련법규를 검토하여, 적용 대상 여부 및 점검범위를 확인한다.\n(1) 세부항목 (부식(열화) 및 손상)\n▸ 양호 : 피뢰설비의 부식(열화) 및 손상이 없으며, 점검 결과 정기적인 유지 보수로 관리가 우수한 경우\n▸ 보통 : 피뢰설비의 부식(열화) 및 손상이 없으며 성능저하가 없고, 점검 결과 노후화 또는 관리 소홀이 없는 경우\n▸ 미흡 : 피뢰설비의 부식(열화) 및 손상이 심각하거나 성능저하가 심각하며, 점검 결과 노후화 또는 관리가 소홀하여 개선이 필요한 경우\n▸ 불량 : 피뢰설비의 부식(열화) 및 손상이 매우 심각하고, 점검 결과 노후화 또는 관리소홀 등으로 성능 저하가 매우 심각하여 긴급한 조치가 필요한 경우\n(2) 개선방안에 대한 의견\n▸ 지속적인 관리와 점검방법 등을 제안하고 개선이 필요한 부분은 보완 및 교체 등을 제안\n▸ 육안으로 점검할 수 없는 부분(은폐 및 매설 부분)을 관리주체가 점검을 요구할 경우에는 별도의 비용으로 정밀점검할 것을 제안\n(3) 점검세부항목별 합계점수에 따라 점검 판단결과를 ‘양호’,‘보통’,‘미흡’,‘불량’,‘해당없음’으로 표기함\n▸ 양호 : 18점 초과 ▸ 보통 : 14점 초과 18점 이하 ▸ 미흡 : 10점 초과 14점 이하 ▸ 불량 : 10점 이하\n▸ 해당 "},{"no":"3.3.1","t":"건물에너지","small":"건물에너지","law":"녹색건축물 조성지원법 제15조, 건축물의 에너지절약설계기준 제2조","subs":[{"n":"단열성능 유지 여부","pts":60,"cnt":null,"o":["양호","보통","미흡","불량","해당없음"],"L":[{"t":"단열상태","pts":30,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]},{"t":"창호","pts":20,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]},{"t":"출입문","pts":10,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]}]},{"n":"결로방지성능 유지 여부","pts":20,"cnt":null,"o":["양호","보통","미흡","불량","해당없음"],"L":[{"t":"결로방지상태","pts":20,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]}]},{"n":"기밀성능 유지 여부","pts":20,"cnt":null,"o":["양호","보통","미흡","불량","해당없음"],"L":[{"t":"기밀상태","pts":20,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]}]}],"status":"◦창호 : □ 3중창 이상  □ 복층창  □ 단창  □ 파손/망실\n◦출입문 : □ 방풍구조문  □ 유리문(복층창)  □ 유리문(단창문) 또는 일반문  □ 파손/망실\n◦결로 발생 위치 : □ 거실  □ 발코니  □ 지하층  □ 기타 (   )","crit":"1) 세부항목에 표기한 점수[배점 × 각 항목별 가중치(1.0, 0.8, 0.6, 0.4)]를 합산하여 기입함\n2) ‘해당없음’의 경우, 점수에 ( - ) 로 표기함\n3) 점검기준\n▸ 점검 전 대상 건축물의 건축허가일, 사용승인일 확인 및 해당 점검항목의 관련법규를 검토하여, 적용 대상 여부 및 점검범위를 확인한다.\n(1) 세부항목 (단열상태) (아래 건축허가 기준일은 단열상태 판단을 위한 참고사항임)\n▸ 양호 : 출입문, 창호, 내・외벽 등의 점검 결과 단열관련 성능저하가 없고 유지관리가 우수한 경우\n   (참고 : 건축허가일이 2013년 9월 1일 이후인 건축물의 단열 등 성능수준)\n▸ 보통 : 출입문, 창호, 내・외벽 등의 점검 결과 단열관련 성능저하가 없는 경우\n   (참고 : 건축허가일이 2001년 1월 17일부터  2013년 8월 31일 이전인 건축물의 단열 등 성능수준)\n▸ 미흡 : 출입문, 창호, 내・외벽 등의 점검 결과 훼손 및 변경 등으로 단열관련 성능저하가 있어 개선이 필요한 경우\n   (참고 : 건축허가일이 2001년 1월 16일 이전인 건축물의 단열 등 성능수준)\n▸ 불량 : 출입문, 창호, 내・외벽 등의 점검 결과 심각한 훼손 및 변경 등으로 단열, 결로방지, 기밀관련 성능 저하가 매우 심각하여 긴급한 조치가 필요한 경우\n   (참고 : 건축허가일이 2001년 1월 16일 이전인 건축물의 단열 등 성능수준)\n(2) 세부항목 (결로 발생 여부 상태)\n▸ 양호 : 거실 내벽, 발코니, 지하층 등의 점검 결과 유지관리가 우수하고 결로 및 결로 흔적이 없는 경우\n▸ 보통 : 거실 내벽, 발코니, 지하층 등의 점검 결과 결로 및 결로 흔적은 있으나 성능저하가 없는 경우\n▸ 미흡 : 거실 내벽, 발코니, 지하층 등의 점검 결과 결로 및 결로 피해(곰팡이 등)로 성능 저하가 있어 개선이 필요한 경우\n▸ 불량 : 거실 내벽, 발코니, 지하층 등의 점검 결과 심각한 결로 및 결로 피해(곰팡이 등)로 성능 저하가 심각하여 긴급한 조치가 필요한 경우\n(3) 세부항목 (기밀상태)\n▸ 양호 : 창짝 간, 창틀과 창짝 간, 문틀과 문짝 간 등의 점검 결과 틈새가 없고 기밀관련 성능저하가 없으며 유지관리가 우수한 경우 (예시 : 창문을 닫은 상태에서 바람 새는 소리가 거의 들리지 않는다.)\n▸ 보통 : 창짝 간, 창틀과 창짝 간, 문틀과 문짝 간 등의 점검 결과 틈새가 없는 경우\n   (예시 : 창문을 닫은 상태에서 바람 새는 소리가 미약하게 들린다.)\n▸ 미흡 : 창짝 간, 창틀과 창짝 간, 문틀과 문짝 간 등의 점검 결과 틈새 및 기밀관련 성능저하가 있어 개선 이 필요한 경우 (예시 : 창문을 닫은 상태에서 바람 새는 소리가 잘 들린다.)\n▸ 불량 : 창짝 간, 창틀과 창짝 간, 문틀과 문짝 간 등의 점검 결과 틈새가 있고 기밀관련 심각한 성능저하가 있어 긴급한 조치가 필요한 경우 (예시 : 창문이 닫히지 않고 바람 새는 소리가 매우 잘 들린다.)\n(4) 개선방안에 대한 의견\n▸ 출입구, 창호 등에서 열손실이 있는 경우, 방풍실 설치, 창호 보수 및 교체 (창호코킹 재시공 포함), 이중창 설치, 단열재 보강 등을 제안\n▸ 건축물 외벽 등에 결로 발생 시 방습벽을 설치하거나, 환기설비를 보완하여 기능이 유지될 수 있도록 제안\n▸ 노후화로 창호가 기밀하지 않은 경우 기밀성능 확보를 위한 개선방안(모헤어, 실링재 보강 등)을 제안\n5) 점검세부항목별 합계점수에 따라 점검 판단결과를 ‘양호’,‘보통’,‘미흡’,‘불량’,‘해당없음’으로 표기함\n(배점 20점) ▸ 양호 : 18점 초과 ▸ 보통 : 14점 초과 18점 이하 ▸ 미흡 : 10점 초과 14점 이하 ▸ 불량 : 10점 이하\n(배점 60점) ▸ 양호 : 54점 초과 ▸ 보통 : 42점 초과 54점 이하 ▸ 미흡 : 30점 초과 42점 이하 ▸ 불량 : 30점 이하\n▸ 해당 없음 : 대상 건축물이 적용대상이 아닌 경우 (해당없음 사유 및 근거를 반드시 제시)"},{"no":"3.3.2","t":"인증 여부","small":"인증 여부","law":"녹색건축물 조성지원법 제16조(녹색건축의 인증) (과거 건축법 제65조), 녹색건축 인증에 관한 규칙(전문), 건축법 제65조의2, 지능형건축물의 인증에 관한 규칙 전문, 녹색건축물조성지원법 제17조 (과거 건축법 제66조의2), 건축물 에너지효율등급 인증 및 제로에너지건축물 인증에 관한 규칙, 건축물의 에너지절약 설계기준","subs":[{"n":"지능형건축물 인증 유지 여부","pts":null,"cnt":1,"o":["인증","재인증","만료","해당없음"],"L":[]},{"n":"에너지효율등급 인증 유지 여부","pts":null,"cnt":1,"o":["인증","재인증","만료","해당없음"],"L":[]},{"n":"제로에너지건축물 인증 유지 여부","pts":null,"cnt":1,"o":["인증","재인증","만료","해당없음"],"L":[]},{"n":"녹색건축물 인증 유지 여부","pts":null,"cnt":1,"o":["인증","재인증","만료","해당없음"],"L":[]}],"status":"◦지능형건축물 인증 등급\n  ㆍ□ 1등급 □ 2등급 □ 3등급 □ 4등급 □ 5등급\n◦에너지효율등급 인증 등급\n  ㆍ□ 1+++등급 □ 1++등급 □ 1+등급 □ 1등급 □ 2등급 □ 3등급 □ 4등급 □ 5등급\n     □ 6등급 □ 7등급\n◦제로에너지건축물 인증 등급\n  ㆍ□ 1등급 □ 2등급 □ 3등급 □ 4등급 □ 5등급\n◦녹색건축물 인증 등급\n  ㆍ□ 1등급 □ 2등급 □ 3등급 □ 4등급","crit":"1) 인증유지 여부를 확인하여 ‘점검 판단결과’에 ‘인증’,‘재인증’,‘만료’,‘해당없음’ 중 해당란에 표기하며, 세부항목별로 ‘인증’,‘재인증’ 건수를 기입하고 이를 합산하여 소계에 기입함\n2) ‘해당없음’의 경우, 건수에 ( - ) 로 표기함\n3) 점검기준\n▸ 점검 전 대상 건축물의 건축허가일, 사용승인일 확인 및 해당 점검항목의 관련법규를 검토하여, 적용 대상 여부 및 점검범위를 확인한다.\n▸ 인증 : 인증을 받은 건축물이 인증 내용을 유지하고 있는 경우\n▸ 재인증 : 인증을 받은 건축물이 해당 기간 내에 재인증을 받은 경우\n▸ 만료 : 인증 또는 재인증을 받은 건축물의 인증 기간이 만료된 경우\n▸ 해당없음 : 대상 건축물이 적용대상이 아닌 경우 (해당없음 사유 및 근거를 반드시 제시)\n4) 개선방안에 대한 의견\n▸ 각 인증 (지능형 건축물 인증, 에너지효율등급 인증, 제로에너지건축물 인증,친환경건축물 인증(녹색건축 인증))을 받은 건축물이 해당 재인증을 받지 않은 경우 재인증을 유도하여 각 인증별 기능이 유지될 수 있도록 제안"},{"no":"3.4.1","t":"옹벽․석축 등 사면․절개지 등","small":"옹벽・석축 등 사면・절개지 등","law":"건축법 제40조, 건축법 시행규칙 제25조","subs":[{"n":"옹벽ㆍ석축 등의 안전 유지 여부","pts":25,"cnt":null,"o":["양호","보통","미흡","불량","해당없음"],"L":[{"t":"옹벽・석축 균열/손상","pts":25,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]}]},{"n":"사면ㆍ절개지 등의 안전 유지 여부","pts":25,"cnt":null,"o":["양호","보통","미흡","불량","해당없음"],"L":[{"t":"사면・절개지의 토사유실/낙석 여부","pts":25,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]}]}],"status":"◦옹벽, 석축 등의 현황 (‘해당없음’의 경우를 제외하고 표기)\n ㆍ옹벽, 석축 등 규모 :  높이 (     ) m, 폭 (     ) m\n ㆍ건축물과 옹벽 등 이격거리 중 최소거리 :  (     ) m","crit":"1) 세부항목에 표기한 점수[배점 × 각 항목별 가중치(1.0, 0.8, 0.6, 0.4)]를 합산하여 기입함\n2) ‘해당없음’의 경우, 점수에 ( - ) 로 표기함\n3) 점검기준\n▸ 점검 전 대상 건축물의 건축허가일, 사용승인일 확인 및 해당 점검항목의 관련법규를 검토하여, 적용 대상 여부 및 점검범위를 확인한다.\n(1) 세부항목(옹벽 균열/손상, 석축 균열/손상)\n *결함 유형 : 균열, 손상, 누수, 백태, 박락, 철근노출, 배부름, 세굴, 활동, 침하, 전도 ,배수공 막힘 등\n▸ 양호 : 옹벽, 석축 등에 결함이 없으며, 점검 결과 정기적인 유지 보수로 관리가 우수한 경우\n▸ 보통 : 옹벽, 석축 등에 발생한 결함의 정도가 대상 시설물 및 건축물 안전에 영향이 없으며, 점검 결과 관리 소홀이 없는 경우  (예시 : 미세균열이나 약간의 박락, 배부름, 배수공 조립토 배출 등)\n▸ 미흡 : 옹벽, 석축 등에 발생한 결함의 정도가 심하여 대상 시설물의 전도(붕괴) 및 건축물의 안전에 악영향이 우려되어 개선이 필요한 경우 (예시 : 중대한 균열, 심한 배부름, 침하, 탈락이 있으며 배수공이 없거나 막힘)\n▸ 불량 : 옹벽, 석축 등에 발생한 결함의 정도가 매우 심하여 대상 시설물의 전도(붕괴) 및 건축물의 안전에 지대한 영향을 미쳐 긴급한 조치가 필요한 경우 (예시 : 중대균열, 매우 심한 정도의 배부름, 침하, 탈락, 배수공이 없는 경우)\n(2) 세부항목(사면의 토사유실/낙석 여부, 절개지 토사유실/낙석 여부)\n▸ 양호 : 사면, 절개지 등에 토사유실/낙석이 없으며, 점검 결과 정기적인 유지 보수로 관리가 우수한 경우 (비탈면이 안정화 되어 있고 누수에 의한 침수 및 붕괴의 위험이 없는 경우)\n▸ 보통 : 사면, 절개지 등에 토사유실/낙석의 정도가 대상 시설물과 건축물의 안전에 영향이 없으며, 점검 결과 관리 소홀이 없는 경우 (배수상태가 좋지 않고 일부 구간의 보수가 요구되는 경우)\n▸ 미흡 : 사면, 절개지 등에 토사유실/낙석의 정도가 심하여 대상 시설물의 전도(붕괴)와 건축물의 안전에 영향을 미칠 것으로 우려되어 개선이 필요한 경우 (배수 상태가 좋지 않고 전체 구간의 1) 세부항목에 표기한 점수[배점 × 각 항목별 가중치(1.0, 0.8, 0.6, 0.4)]를 합산하여 기입함\n2) ‘해당없음’의 경우, 점수에 ( - ) 로 표기함\n3) 자중 이외의 하중을 지지하지 않는 벽체는 해당하지 않음\n4) 점수 산정방법\n※ 점검 부재의 총 배점이 50점 초과 또는 그 미만의 경우 50점 기준으로 환산하여 계산한다.\n 예) 철근콘크리트 벽식구조에서 벽체는 ‘보통’(0.8), 슬래브와 주계단은 ‘미흡’(0.6)으로 평가된 경우\n   총배점 환산 예시 : [0.8×15 + 0.6×(5+5)] × 50 / (15+5+5) = 36 으로 산정한다.\n5) 점검기준\n▸ 점검 전 대상 건축물의 건축허가일, 사용승인일 확인 및 해당 점검항목의 관련법규를 검토하여, 적용 대상 여부 및 점검범위를 확인한다.\n(1) 세부항목 (철근콘크리트 구조)\n점검 결과\n철근콘크리트 부재 점검·판단기준\n▸ 양호 : - 구조부재에 균열, 손상, 누수가 발생하지 않은 상태\n- 점검 결과 정기적인 유지보수를 실시하여 관리가 우수한 상태\n▸ 보통 : - 균열 및 손상의 정도가 건축물 안전에 영향이 없는 상태로서 아래에 해당하는 경우\n1) 구조부재에 폭 0.3mm 미만의 균열이 발생한 상태\n2) 구조부재에 구조적 영향이 없는 수준의 경미한 손상* 이 있는 상태\n * 약간의 누수 흔적, 백태, 박리, 박락, 점녹 등\n▸ 미흡 : - 균열 및 손상의 정도가 심하여 안전에 영향을 미칠 것으로 우려되어 보수, 보강이 필요한 상태로서 아래의 상태에 해당하는 경우\n1) 구조부재에 폭 0.3mm ~ 0.5mm 미만의 균열이 발생한 상태\n2) 콘크리트의 박리 깊이가 1.0㎜ 미만, 박락 깊이가 20㎜미만인 상태\n3) 노출된 철근 표면에 녹이 발생하였고 부분적으로 들뜬 녹이 발생된 상태\n▸ 불량 : - 균열 및 손상의 정도가 매우 심하여 안전에 지대한 영향을 미쳐 긴급한 조치가 필요한 경우로서 아래의 상태에 해당하는 경우\n1) 구조부재에 폭 0.5㎜ 이상의 균열이 발생한 상태\n2) 콘크리트의 박리 깊이가 1.0㎜ 이상, 박락 깊이가 20㎜ 이상의 상태\n3) 구조부재에 진행성 누수가 확연하거나, 광범위한 백태가 발생한 상태\n4) 구조적인 영향에 따른 균열*이 발생한 상태\n * 보: 중앙부 하단에서 상부까지 발생된 전체적인 휨 균열, 단부의 경사 전단균열 등\n * 기둥 : 부재방향 균열, 단부 경사 균열 등\n * 슬래브 : 상부면에 보 또는 벽체 둘레 주변 균열, 하부면 주근의 직각방향 균열 등\n5) 노출된 철근의 들뜬 녹이 광범위하게 발생하였거나 두꺼운 층상의 녹이 발생한 상태\n(2) 세부항목 (강구조)\n점검 결과\n강구조 부재 점검·판단기준\n▸ 양호 : - 구조부재 및 용접부, 볼트 접합부, 내화피복 등에 결함이 발생하지 않은 상태\n- 점검 결과 정기적인 유지보수를 실시하여 관리가 우수한 상태\n▸ 보통 : - 구조부재 및 접합부의 결함 정도가 건축물 안전에는 영향이 없으며, 아래의 상태에 해당하는 경우\n1) 접합부(용접 및 볼트)에 국부적인 미세결함 등이 있는 상태\n2) 볼트 접합부에 5% 미만의 볼트 누락, 풀림 등이 있는 경우\n3) 볼트 접합부에 부분적으로 들뜬 녹이 있거나, 용접재에 단면결손이 없는 부식이 있는 경우\n4) 내화피복 부위에 경미한 손상이 있는 상태\n▸ 미흡 : - 구조부재 및 접합부의 결함 정도가 심하여 안전에 영향을 미칠 것으로 우려되어 보수, 보강이 필요한 상태로서 아래의 상태에 해당하는 경우\n1) 접합부(용접 및 볼트)에 부분적인 결함 등이 있는 상태\n2) 볼트 접합부에 10% 이상 30% 미만의 볼트 누락, 풀림 등이 있는 경우\n3) 볼트 및 용접 접합부에 부식 등으로 5%이상~10% 미만의 두께 감소 등의 단면 결손이 있는 경우\n4) 내화피복의 두께 부족 비율 또는 손상된 면적이 전체 대비 15% 이상 30% 미만인 경우\n▸ 불량 : - 구조부재 및 접합부의 결함 정도가 매우 심하여 안전에 지대한 영향을 미쳐 긴급한 조치가 필요한 경우로서 아래의 상태에 해당하는 경우\n1) 접합부(용접 및 볼트)에 광범위한 결함 등이 발생하여 내력 저하 우려가 있는 불량한 상태\n2) 볼트 접합부에 30% 이상의 볼트 누락, 풀림 등이 있는 경우\n3) 볼트 및 용접 접합부에 부식 등으로 10%이상의 두께 감소 등의 단면 결손이 있는 경우\n4) 내화피복의 두께 부족 비율 또는 손상된 면적이 전체 대비 30% 이상인 경우\n(3) 개선방안에 대한 의견\n▸  주요 구조부재에 구조적 균열, 부식 등의 결함이 있는 경우 형태 및 진행경과 등을 파악하고 중량물을 제거하여 하중을 감소하고 구조보강 조치를 위한 정밀안전진단을 받도록 제안\n5) 점검세부항목별 합계점수에 따라 점검 판단결과를 '양호','보통,'미흡','불량','해당없음'으로 표기함\n▸ 양호 : 45점 초과 ▸ 보통 : 35점 초과 45점 이하 ▸ 미흡 : 25점 초과 35점 이하 ▸ 불량 : 25점 이하\n▸ 해당없음 : 대상 건축물이 적용 대상이 아니거나 (해당없음 사유 및 근거를 반드시 제시), 육안으로 점검할 수 없는 경우 (점검 불가시 불가사유를 근거와 함께 세부적으로 명시)"},{"no":"3.4.6","t":"이상징후 청문점검","small":"이상징후청문점검","law":"건축법 제48조, 건축법 시행령 제32조, 건축물의 구조기준 등에 관한 규칙 (전문)","subs":[{"n":"이상징후 발생 여부","pts":20,"cnt":null,"o":["양호","보통","미흡","불량","해당없음"],"L":[{"t":"이상징후 구분","pts":20,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]}]}],"status":"◦이상징후 발생 유형*\n  □ 구조체 이상 발생음 (가중치 3)  □ 잦은 진동 (가중치 2)\n  □ 슬래브 부분 침하 (가중치 1)     □ 출입문 개폐불량 (가중치 1)\n  □ 마감재 어긋남 (가중치 1)\n* 항목별 가중치 고려 건수 합산 (예; 구조체 이상 발생음의 경우 가중치가 3 이므로 3건에 해당)","crit":"1) 세부항목에 표기한 점수[배점 × 각 항목별 가중치(1.0, 0.8, 0.6, 0.4)]를 합산하여 기입함\n2) ‘세부항목’의 ‘이상징후 발생 여부’는 ‘세부항목 점검현황’의 ‘이상징후 발생 유형’ 중 해당하는 유형에 모두 표기하고 가중치를 고려하여 표기한 건수를 합산하여 기입함\n3) ‘해당없음’의 경우, 점수에 ( - ) 로 표기함\n4) 점검기준\n▸ 점검 전 대상 건축물의 건축허가일, 사용승인일 확인 및 해당 점검항목의 관련법규를 검토하여, 적용 대상 여부 및 점검범위를 확인한다.\n▸ 양호 : 0건  ▸ 보통 : 1건  ▸ 미흡 : 2건  ▸ 불량 : 3건 이상\n5) 개선방안에 대한 의견\n▸이상 징후가 지속 및 반복적으로 발생하는 경우 원인 파악을 위한 안전점검 등을 제안\n▸이상 징후 원인이 비구조적인 원인에 해당 시 개선이 필요한 부분의 보완 및 교체를 제안\n▸유지관리 방법 및 점검 방법 등을 제안\n6) 점검세부항목별 합계점수에 따라 점검 판단결과를 ‘양호’,‘보통’,‘미흡’,‘불량’,‘해당없음’으로 표기함\n▸ 양호 : 18점 초과 ▸ 보통 : 14점 초과 18점 이하 ▸ 미흡 : 10점 초과 14점 이하 ▸ 불량 : 10점 이하\n▸ 해당없음 : 대상건축물이 적용대상이 아닌 경우 (해당없음 사유 및 근거를 반드시 제시)"},{"no":"3.4.7","t":"마감재 육안점검","small":"마감재 육안점검","law":"건축법 제48조, 건축법 시행령 제32조, 건축물의 구조기준 등에 관한 규칙 (전문)","subs":[{"n":"마감재 노후화 여부","pts":10,"cnt":null,"o":["양호","보통","미흡","불량","해당없음"],"L":[{"t":"외벽 균열/손상 상태","pts":3,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]},{"t n(1) 세부항목 (구조변경, 용도변경으로 인한 안전 여부)\n▸ 양호 : 구조 및 용도변경으로 인하여 보, 기둥, 내력벽, 슬래브, 가새, 접합부 등의 균열 및 손상이나 하중증가가 없으며, 점검 결과 정기적인 유지 보수로 관리가 우수한 경우\n▸ 보통 : 구조 및 용도변경으로 인하여 보, 기둥, 내력벽, 슬래브, 가새, 접합부 등의 균열 및 손상이나 하중증가의 정도가 건축물과 구조물의 안전에 영향이 없으며, 점검 결과 관리 소홀이 없는 경우\n▸ 미흡 : 구조 및 용도변경으로 인하여 보, 기둥, 내력벽, 슬래브, 가새, 접합부 등의 균열 및 손상이나 하중증가의 정도가 심하여 건축물과 구조물의 안전에 영향을 미칠 것으로 우려되어 개선이 요구되는 경우\n▸ 불량 : 구조 및 용도변경으로 인하여 보, 기둥, 내력벽, 슬래브, 가새, 접합부 등의 균열 및 손상이나 하중증가의 정도가 매우 심하여 건축물과 구조물의 안전에 지대한 영향을 미쳐 긴급한 조치가 필요한 경우\n(2) 개선방안에 대한 의견\n▸ 사용승인도면, 건축물 현황도, 건축물대장 등을 기준으로 구조 또는 용도의 변경이 건축행정절차를 거치치 않은 경우, 허가, 신고 등 건축행정절차를 따르도록 제안하거나 원상복구를 제안\n※ 점검세부항목별 합계점수에 따라 점검 판단결과를 ‘양호’,‘보통’,‘미흡’,‘불량’,‘해당없음’으로 표기함\n▸ 양호 : 9점 초과 ▸ 보통 : 7점 초과 9점 이하 ▸ 미흡 : 5점 초과 7점 이하 ▸ 불량 : 5점 이하\n▸ 해당없음 : 대상건축물이 적용대상이 아닌 경우 (해당없음 사유 및 근거를 반드시 제시)"},{"no":"3.4.9","t":"내진성능","small":"내진성능","law":"건축법 제48조, 건축법 시행령 제32조, 건축물의 구조기준 등에 관한 규칙 (전문)","subs":[{"n":"내진설계 적용 여부","pts":100,"cnt":null,"o":["적합","부적합","해당없음"],"L":[{"t":"내진설계 적용 여부","pts":100,"note":"","o":[["적합",1.0],["부적합",0.4],["해당없음",null]]}]}],"status":"◦ 내진설계대상 건축물1) 여부 :  □ 대상   □ 비대상\n   (내진설계 대상 건축물인 경우)\n   ㆍ 확인 서류 : □ 구조계산서 □ 구조안전확인서 □ 내진상세 적용(구조도면) □ 건축물대장\n   ㆍ 내진설계 여부 : □ 적용  □ 미적용 □ 판단불가 2)\n 1) 건축허가일 또는 사용승인일, 연면적, 층수, 경간 등으로 판단\n 2) 판단불가 시 근거 및 사유를 비고란에 명시","crit":"1) 세부항목에 표기한 점수[배점 × 각 항목별 가중치(1.0, 0.8, 0.6, 0.4)]를 합산하여 기입함\n2) ‘해당없음’의 경우, 점수에 ( - ) 로 표기함\n3) 점검기준\n▸ 점검 전 대상 건축물의 건축허가일, 사용승인일 확인 및 해당 점검항목의 관련법규를 검토하여, 적용 대상 여부 및 점검범위를 확인한다.\n(1) 세부항목(내진설계 적용 여부)\n▸ 적합 : 건축물의 건축허가 또는 사용승인 당시 내진설계 대상 건축물에 해당하고,  ‘세부항목 점검현황’에 따른 확인서류 중 1개 이상의 서류로 내진설계가 적용된 건축물임을 확인할 수 있는 경우\n▸ 부적합 : 건축물의 건축허가 또는 사용승인 당시 내진설계 대상에 해당하나 세부항목 점검현황’에 따른 확인서류로 내진설계 적용 여부를 판단할 수 없는 경우 또는 내진설계가 미적용된 경우\n▸ 해당없음 : 건축물의 건축허가 또는 사용승인 당시 내진설계 대상 건축물이 아닌 경우 (해당없음 사유 및 근거를 반드시 제시)\n(2) 개선방안에 대한 의견\n▸ 내진설계 대상에 해당하나 내진설계 여부를 확인할 수 없는 경우 관련 문서의 보완을 유도하여 지진에 대한 안전을 확인할 수 있도록 제안\n※ 점검세부항목 점수에 따라 점검 판단결과를 ‘적합’,‘부적합’,‘해당없음’으로 표기함\n▸ 적합 : 100점 ▸ 부적합 : 40점 ▸ 해당없음 : ( - )"},{"no":"3.5.1","t":"실내피난성능","small":" 매우 어려운 경우\n(4) 개선방안에 대한 의견\n▸ 복도, 계단, 출입구는 화재 등 비상 시 안전한 피난을 위한 공간임을 인식시키고 해당 항목 중 성능저하 또는 개선이 필요한 부분에 대해 성능개선 또는 원상복구를 제안\n4) 점검세부항목별 합계점수에 따라 점검 판단결과를 ‘양호’,‘보통’,‘미흡’,‘불량’,‘해당없음’으로 표기함\n(배점 40점) ▸ 양호 : 36점 초과 ▸ 보통 : 28점 초과 36점 이하  ▸ 미흡 : 20점 초과 28점 이하 ▸ 불량 : 20점 이하\n(배점 20점) ▸ 양호 : 18점 초과 ▸ 보통 : 14점 초과 18점 이하  ▸ 미흡 : 10점 초과 14점 이하 ▸ 불량 : 10점 이하\n(배점 10점) ▸ 양호 : 9점 초과 ▸ 보통 : 7점 초과 9점 이하  ▸ 미흡 : 5점 초과 7점 이하 ▸ 불량 : 5점 이하\n▸ 해당없음 : 대상건축물이 적용대상이 아닌 경우 (해당없음 사유 및 근거를 반드시 제시)"},{"no":"3.5.2","t":"옥상광장","small":"옥상광장","law":"건축법 제49조제1항, 건축법 시행령 제40조, 건축물의 피난·방화구조 등의 기준에 관한 규칙 제13조제3항","subs":[{"n":"옥상광장 피난성능 유지 여부","pts":20,"cnt":null,"o":["양호","보통","미흡","불량","해당없음"],"L":[{"t":"옥상광장 면적 유지","pts":5,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]},{"t":"옥상광장 난간 상태","pts":5,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]},{"t":"옥탑피난통로 적치물","pts":10,"note":"","o":[["양호",1.0],["보통",0.8],["미흡",0.6],["불량",0.4],["해당없음",null]]}]}],"status":"◦출입문 상시개방 및 개폐장치 작동 여부 (개폐장치가 있는 경우)\n  □ 상시 개방 □ 개폐장치 작동 □ 아니오 (개폐장치 미작동)\n ※ 문이 닫혀 있더라도 잠금장치로 잠가놓지 않은 경우 포함\n◦옥탑피난통로 적치물\n  □ 0개 □ 1～2개 □ 3～4개 □ 10개 초과\n- 옥상광장 면적 : □ 0～25㎡  □ 25～50㎡  □50㎡～100㎡ □100㎡ 초과","crit":"1) 세부항목에 표기한 점수[배점 × 각 항목별 가중치(1.0, 0.8, 0.6, 0.4)]를 합산하여 기입함\n2) ‘해당없음’의 경우, 점수에 ( - ) 로 표기함\n3) 점검기준\n▸ 점검 전 대상 건축물의 건축허가일, 사용승인일 확인 및 해당 점검항목의 관련법규를 검토하여, 적용 대상 여부 및 점검범위를 확인한다.\n(1) 세부항목(옥상광장 면적 유지)\n▸ 양호 : 옥상광장에 적치물 등이 없이 옥상광장의 면적 감소가 없으며, 유지 관리가 우수한 경우\n▸ 보통 : 옥상광장에 실외기, 냉각탑 등 시설물이나 적치물이 있으나 피난 안전에 지장이 없는 경우\n▸ 미흡 : 옥상광장에 실외기, 냉각탑 등 시설물이나 적치물이 과대하여 옥상광장 면적이 협소하거나 안전한 피난공간 확보를 위해 개선이 필요한 경우\n▸ 불량 : 옥상광장에 실외기, 냉각탑 등 시설물이나 적치물이 매우 과대하여 옥상광장 면적이 매우 협소하거나 안전한 피난공간 확보에 지대한 영향을 미쳐 긴급한 조치가 필요한 경우\n(2) 세부항목(옥상광장 난간 상태)\n▸ 양호 : 난간의 높이가 기준에 적합하고 콘크리트 또는 철재로 되어 있으며 손상없이 견고한 구조인 경우\n▸ 보통 : 난간의 높이가 기준에 적합하고 콘크리트 또는 철재로 되어 있으며 난간의 일부가 손상되거나 부식이 있으나 난간의 기능에 이상이 없는 경우\n▸ 미흡 : 난간의 높이가 기준보다 낮거나 전반적으로 난간이 손상 또는 부식되어 개선이 필요한 경우\n▸ 불량 : 난간의 높이가 기준보다 낮거나 난간 손상 또는 부식의 정도가 심하여 피난 안전에 지대한 영향을 미쳐 긴급한 조치가    사진은 기기 사진첩이 아니라 이 앱(브라우저) 저장소에만 있으므로 JSON 백업 필수 */

/* design: 설계도서 적합여부 / sc: 세부 점검결과(배점) / st: 점검현황 체크·빈칸 / ck: 점검기준 확인 표시 */
const blankState = () => ({meta:{}, ans:{}, cmp:{}, design:{}, cnt:{}, memo:{}, cap:{}, sc:{}, st:{}, ck:{}, others:{}, otherNote:{}, prep:{}, sum:{}, use20:false, hasGong:false});
/* v3: 매뉴얼 개정(안) 서식으로 변경 — 이전 버전 저장 데이터 변환 */
function migrateState(st){
  if ((st.v || 0) >= 3) return st;
  /* 법규유지(대지·높이) 기존 '유지 여부'(적합/부적합/도면없음/해당없음)는 설계도서 적합여부에 해당 */
  ['d1','d2','d3','d4','d5','h1','h2','h3','h4','h5','h6'].forEach(id => {
    const k = id + '_q0';
    if (st.ans[k]) { if (!st.design[id]) st.design[id] = st.ans[k]; delete st.ans[k]; }
    if (st.cnt[id]) { st.cnt[k] = st.cnt[id]; delete st.cnt[id]; }
  });
  /* 범죄예방 세부기준 1·2 → 3.1.16~3.1.20 으로 분리 */
  [['c5_q1','c7_q0'], ['c6_q1','c8_q0'], ['c6_q2','c9_q0']].forEach(([a, b]) => {
    if (st.ans[a] && !st.ans[b]) st.ans[b] = st.ans[a];
    delete st.ans[a];
  });
  /* 그 밖의 항목별 '지적 건수'는 서식에서 빠졌으므로 비고에 보존 */
  Object.keys(st.cnt).forEach(k => {
    if (k.includes('_q') || !st.cnt[k]) return;
    st.memo[k] = st.memo[k] || {};
    st.memo[k].note = ((st.memo[k].note || '') + ' (이전 버전 지적건수 ' + st.cnt[k] + '건)').trim();
    delete st.cnt[k];
  });
  st.v = 3;
  return st;
}

function migratePhotos(id){
  return new Promise(res => {
    const tx = db.transaction('photos', 'readwrite'), st = tx.objectStore('photos');
    st.openCursor().onsuccess = e => {
      const c = e.target.result; if (!c) return;
      if (String(c.key).indexOf('/') < 0) { st.put(c.value, id + '/' + c.key); c.delete(); }
      c.continue();
    };
    tx.oncomplete = tx.onerror = () => res();
  });
}

async function addPhoto(itemId, file){
  if (!db) { alert('이 열기 방식에서는 사진 저장이 지원되지 않습니다.\n' +
    (IS_IOS ? 'Safari로 웹주소를 열어 홈 화면에 추가한 뒤 사용하거나(개인정보 보호 브라우징 제외), ' : 'Chrome 주소창에 file:/// 경로로 열거나, ') +
    '휴대폰 카메라로 직접 촬영 후 사무실에서 정리해 주세요.'); return; }
  const img = await shrink(file, 1600, 0.82);
  if (!img) { alert('이미지를 읽을 수 없습니다: ' + file.name); return; }
  const pid = itemId + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  db.transaction('photos','readwrite').objectStore('photos').put(img, pk(pid));
  S.cap[pid] = ''; save();
  renderPhotos(itemId);
}
function shrink(file, maxW, q){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxW / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL('image/jpeg', q));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); res(null); };
    img.src = URL.createObjectURL(file);
  });
}
function renderPhotos(itemId){
  const list = document.getElementById('ph_' + itemId);
  if (!list || !db) return;
  const tx = db.transaction('photos').objectStore('photos');
  const keys = Object.keys(S.cap).filter(k => k.startsWith(itemId + '_'));
  list.innerHTML = '';
  keys.forEach(pid => {
    tx.get(pk(pid)).onsuccess = e => {
      if (!e.target.result) return;
      const d = document.createElement('div'); d.className = 'ph';
      const im = document.createElement('img'); im.src = e.target.result;
      im.onclick = () => showPhoto(im.src);
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '×';
      del.onclick = () => { if (confirm('사진을 삭제할까요?')) { db.transaction('photos','readwrite').objectStore('photos').delete(pk(pid)); delete S.cap[pid]; save(); renderPhotos(itemId); } };
      const cap = document.createElement('input'); cap.placeholder = '위치/내용'; cap.value = S.cap[pid] || '';

/* 점검현황 한 줄 → [{type:'box'|'blank'|'text', label, rest}] — '□ 라벨', '(   )' 빈칸 인식 */
function statusTokens(line){
  const out = [];
  let box = false;
  line.trim().split(/(□|\(\s*\))/).forEach(p => {
    if (p === '') return;
    if (p === '□') { box = true; return; }
    if (/^\(\s*\)$/.test(p)) { out.push({type:'blank'}); return; }
    if (box) {
      box = false;
      let label = p, rest = '';
      if ((p.match(/\(/g) || []).length > (p.match(/\)/g) || []).length) { const i = p.lastIndexOf('('); label = p.slice(0, i); rest = p.slice(i); }
      out.push({type:'box', label:label.trim(), rest});
      return;
    }
    out.push({type:'text', label:p});
  });
  return out;
}
/* 점검현황 체크 건수 (firstBlock: 첫 '◦ … 유형' 묶음만 — 법규유지 변경유형 합산용, '가중치 N' 반영) */
function statusCount(item, firstBlock){
  const st = S.st[item.id] || {}, lines = item.m.status.split('\n');
  let started = false, n = 0;
  for (let li = 0; li < lines.length; li++) {
    const t = lines[li].trim();
    if (firstBlock) {
      if (t.startsWith('◦')) { if (started) break; started = true; continue; }
      if (t.startsWith('-')) break;
    }
    let ti = 0;
    statusTokens(lines[li]).forEach(tok => {
      if (tok.type === 'text') return;
      const k = li + '_' + (ti++);
      if (tok.type === 'box' && st[k]) { const w = tok.label.match(/가중치\s*(\d+)/); n += w ? +w[1] : 1; }
    });
  }
  return n;
}
function statusBlock(item, onChange){
  const id = item.id;
  const box = document.createElement('div'); box.className = 'status';
  item.m.status.split('\n').forEach((line, li) => {
    const row = document.createElement('div'); row.className = 'sline';
    const ind = line.match(/^\s*/)[0].length;
    if (ind) row.style.paddingLeft = Math.min(ind, 6) * 4 + 'px';
    if (/^【/.test(line.trim())) row.classList.add('sgrp');
    let ti = 0;
    statusTokens(line).forEach(tok => {
      if (tok.type === 'text') { row.appendChild(document.createTextNode(tok.label)); return; }
      const k = li + '_' + (ti++);
      const st = () => (S.st[id] = S.st[id] || {});
      if (tok.type === 'blank') {
        const inp = document.createElement('input'); inp.className = 'blank';
        inp.value = (S.st[id] || {})[k] || '';
        inp.oninput = () => { if (inp.value) st()[k] = inp.value; else delete st()[k]; save(); };
        row.appendChild(inp);
        return;
      }
      const cb = document.createElement('span'); cb.className = 'sbox' + ((S.st[id] || {})[k] ? ' on' : '');
      cb.textContent = tok.label || '□';
      cb.onclick = () => {
        if (st()[k]) delete st()[k]; else st()[k] = true;
        cb.classList.toggle('on', !!st()[k]); save(); if (onChange) onChange();
      };
      row.appendChild(cb);
      if (tok.rest) row.appendChild(document.createTextNode(tok.rest));
    });
    box.appendChild(row);
  });
  return box;
}
/* 세부항목 점검기준 — 접고 펴기, '▸' 기준 문장은 탭하여 확인 표시 */

/* 세부항목 소계 (배점 × 가중치 합산, 해당없음 제외) */
function subScore(id, si, sub){
  let tot = 0, ev = 0, n = 0, na = 0;
  sub.L.forEach((l, li) => {
    const v = S.sc[id + '_' + si + '_' + li]; if (!v) return;
    n++;
    const o = l.o.find(x => x[0] === v);
    if (!o || o[1] == null) { na++; return; }
    tot += (l.pts || 0) * o[1]; ev += (l.pts || 0);
  });
  return {tot:Math.round(tot * 100) / 100, ev, n, na, all:sub.L.length};
}
/* 매뉴얼 판정 구간: 배점 대비 90% 초과 양호 / 70% 초과 보통 / 50% 초과 미흡 / 이하 불량 (예: 15점 → 13.5·10.5·7.5) */
function suggestResult(sub, sc){
  if (!sc.n) return null;
  if (sc.na === sc.n) return '해당없음';
  if (!sc.ev) return null;
  const r = sc.tot / sc.ev, e = 1e-9;
  if (sub.o.includes('양호')) return r > 0.9 + e ? '양호' : r > 0.7 + e ? '보통' : r > 0.5 + e ? '미흡' : '불량';
  return r > 1 - e ? '적합' : '부적합';
}
/* 보고서용 점검현황 — 체크 ☑ / 미체크 ☐ / 빈칸 입력값 */

      const k = li + '_' + (ti++);
      if (tok.type === 'blank') return '<u>&nbsp;' + (st[k] ? e(st[k]) : '&nbsp;&nbsp;&nbsp;&nbsp;') + '&nbsp;</u>';
      return (st[k] ? '<b>☑ ' + e(tok.label) + '</b>' : '<span style="color:#888">☐ ' + e(tok.label) + '</span>') + e(tok.rest || '');
    }).join(' ');
  }).join('<br>');
}

/* ====== 진행률 / 미작성 ====== */
function itemUnits(st){
  /* [key, kind] 목록: kind ans|cmp|oth */
  st = st || S;
  const u = [];
  FORM.forEach(g => g.items.forEach(it => u.push(...unitsOf(it))));
  OTHERS.forEach((o, i) => u.push(['oth', i, 'oth' + i]));
  if (st.hasGong) GONG.forEach(g => u.push(['ans', g.id + '_q0', g.id]));
  if (st.use20) STRENGTHEN.forEach(it => it.qs.forEach((q, qi) => u.push(['ans', it.id + '_q' + qi, it.id])));
  return u;
}
/* 세부점검표 1개 항목의 필수 입력: 세부항목별 판단결과 + 현행기준 비교·검토 + 설계도서 적합여부 */
function unitsOf(it){
  const u = it.qs.map((q, qi) => ['ans', it.id + '_q' + qi, it.id]);
  if (!it.nocmp) u.push(['cmp', it.id, it.id]);
  if (it.m) u.push(['design', it.id, it.id]);
  return u;
}
function unitDone([kind, key], st){
  st = st || S;
  if (kind === 'ans') return !!st.ans[key];
  if (kind === 'cmp') return !!st.cmp[key];
  if (kind === 'design') return !!(st.design || {})[key];
  return !!st.others[key];
}
function updateProgress(){
  const units = itemUnits();
  const done = units.filter(u => unitDone(u)).length;
  document.getElementById('pfill').style.width = (units.length ? done / units.length * 100 : 0) + '%';
  document.getElementById('ptext').textContent = done + ' / ' + units.length + ' 항목';
  FORM.forEach((g, gi) => {
    const gu = [];
    g.items.forEach(it => gu.push(...unitsOf(it)));
    const d = gu.filter(u => unitDone(u)).length;
    const el = document.getElementById('cnt_g' + gi);
    if (el) { el.textContent = d + '/' + gu.length; el.className = 'cnt' + (d === gu.length ? ' done' : ''); }
  });
  const od = OTHERS.map((o, i) => ['oth', i]).filter(u => unitDone(u)).length;
  const oe = document.getElementById('cnt_oth');
  if (oe) { oe.textContent = od + '/' + OTHERS.length; oe.className = 'cnt' + (od === OTHERS.length ? ' done' : ''); }
}
function showMissing(){
  document.querySelectorAll('.missing').forEach(e => e.classList.remove('missing'));
  let first = null;
  const mark = id => {
    const el = document.getElementById('item_' + id);
    if (!el) return;
    el.classList.add('missing');
    el.closest('details').open = true;
    if (!first) first = el;
  };
  FORM.forEach(g => g.items.forEach(it => { if (unitsOf(it).some(u => !unitDone(u))) mark(it.id); }));
  OTHERS.forEach((o, i) => { if (!S.others[i]) mark('oth' + i); });
  if (S.hasGong) GONG.forEach(g => { if (!S.ans[g.id + '_q0']) mark(g.id); });
  if (S.use20) STRENGTHEN.forEach(it => { if (it.qs.some((q, qi) => !S.ans[it.id + '_q' + qi])) mark(it.id); });
  if (first) first.scrollIntoView({behavior:'smooth', block:'center'});
  else alert('모든 항목이 작성되었습니다!');
}

/* 반환 키는 프로젝트 접두어 없는 사진ID (JSON 파일 호환 유지) */
async function collectPhotos(st, proj){
  st = st || S;
  return new Promise(res => {
    const out = {};
    const keys = Object.keys(st.cap);
    if (!keys.length || !db) return res(out);
    let n = 0;
    const tx = db.transaction('photos').objectStore('photos');
    keys.forEach(pid => {
      tx.get(pk(pid, proj)).onsuccess = e => {
        if (e.target.result) out[pid] = e.target.result;
        if (++n === keys.length) res(out);
      };
    });
  });
}
const safeName = s => String(s).replace(/[\\/:*?"<>|\r\n]+/g, '_').trim();
function dlLink(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
function toast(text, ms){

   - iPhone·iPad    : 공유 창 → [파일에 저장]에서 폴더 선택 (iOS는 웹앱이 폴더를 기억할 수 없음)
   - Android 등     : 브라우저 기본 다운로드 폴더 */
const CAN_DIR = !IS_IOS && 'showDirectoryPicker' in window;
const CAN_ASK = !IS_IOS && 'showSaveFilePicker' in window;
const LK_SAVE = 'wrsc_save_mode', KV_DIR = 'save_dir';
function saveMode(){
  let m = null; try { m = localStorage.getItem(LK_SAVE); } catch(e){}
  if ((m === 'dir' && !CAN_DIR) || (m === 'ask' && !CAN_ASK)) m = null;
  return m || 'download';
}
async function getSaveDir(){ return kvGet(await kvDB(), KV_DIR); }
async function pickSaveDir(){
  try {
    const h = await window.showDirectoryPicker({id:'wrsc_save', mode:'readwrite', startIn:'documents'});
    kvSet(await kvDB(), KV_DIR, h);
    lsPut(LK_SAVE, 'dir');
    return h;
  } catch(e){ return null; }
}
async function ensurePerm(h){
  const o = {mode:'readwrite'};
  if (!h.queryPermission || await h.queryPermission(o) === 'granted') return true;
  return (await h.requestPermission(o)) === 'granted';
}
async function saveToDir(name, blob, folder){
  const root = await getSaveDir();
  if (!root) return false;
  if (!await ensurePerm(root)) return false;
  const dir = folder ? await root.getDirectoryHandle(folder, {create:true}) : root;
  const fh = await dir.getFileHandle(name, {create:true});
  const w = await fh.createWritable(); await w.write(blob); await w.close();
  toast('저장 완료: ' + root.name + ' › ' + (folder ? folder + ' › ' : '') + name);
  return true;
}
async function saveAsk(name, blob){
  const ext = (name.split('.').pop() || '').toLowerCase();
  const T = {json:['점검 데이터', 'application/json'], html:['요약보고서', 'text/html'], zip:['사진 ZIP', 'application/zip']}[ext];
  const opt = {suggestedName:name, id:'wrsc_save', startIn:'documents'};
  if (T) opt.types = [{description:T[0], accept:{[T[1]]:['.' + ext]}}];
  const fh = await window.showSaveFilePicker(opt);
  const w = await fh.createWritable(); await w.write(blob); await w.close();
  toast('저장 완료: ' + fh.name);
  return true;
}

}

/* 파일 저장 — folder: 지정 폴더 모드에서 사용할 프로젝트 하위 폴더 이름 */
async function dl(name, content, mime, folder){
  if (IN_APP) alert('메신저 앱 안의 브라우저에서는 파일 저장이 되지 않을 수 있습니다.\n' + (IS_IOS ? 'Safari' : 'Chrome') + '로 열어서 저장해 주세요.');
  const blob = content instanceof Blob ? content : new Blob([content], {type: mime});
  folder = folder ? safeName(folder) : '';

  /* iOS(특히 홈 화면 앱 모드)는 다운로드가 불안정하므로 공유시트(파일에 저장·카카오톡·메일)를 사용 */
  if (IS_IOS) {
    let file = null;
    try { file = new File([blob], name, {type: mime}); } catch(e){}
    if (!(file && navigator.canShare && navigator.canShare({files:[file]}))) return dlLink(name, blob);
    const share = () => navigator.share({files:[file], title:name}).catch(() => {});
    try { await navigator.share({files:[file], title:name}); }
    catch(e) { if (e.name !== 'AbortError') readyModal(name, '공유 / 파일에 저장', share, blob); }
    return;
  }

  const mode = saveMode();
  if (mode === 'dir' || mode === 'ask') {
    const run = () => mode === 'dir' ? saveToDir(name, blob, folder) : saveAsk(name, blob);
    try {
      if (await run()) return;
      toast('저장 폴더가 지정되지 않았거나 권한이 없어 다운로드 폴더에 저장했습니다. 프로젝트 › 저장 위치에서 폴더를 다시 지정하세요.', 7000);
    } catch(e) {
      if (e.name === 'AbortError') return;                          /* 사용자가 저장 창을 닫음 */
      if (e.name === 'SecurityError' || e.name === 'NotAllowedError')
        return readyModal(name, mode === 'dir' ? '지정 폴더에 저장' : '저장 위치 선택',
          () => run().then(ok => { if (!ok) { dlLink(name, blob); toast('다운로드 폴더에 저장: ' + name); } })
                     .catch(err => { if (err.name !== 'AbortError') alert('저장하지 못했습니다: ' + err.message); }), blob);
      toast('지정 폴더에 저장하지 못해(' + e.message + ') 다운로드 폴더에 저장했습니다.', 7000);
    }
    return dlLink(name, blob);
  }
  dlLink(name, blob);
  toast('다운로드 폴더에 저장: ' + name + (CAN_DIR ? '  (저장 위치는 프로젝트 › 저장 위치에서 변경)' : ''));
}

/* ====== 사진 ZIP 저장 ======
   파일명: 항목번호_항목명_순번_설명.jpg (예: 3.4.5_구조부재 육안점검_01_지하1층 벽체 균열.jpg)
   + 00_사진목록.csv. JPEG는 이미 압축되어 있어 무압축(store) ZIP으로 직접 생성 */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = [];
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let off = 0;
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);   /* 0x0800 = 파일명 UTF-8 */
    lh.setUint16(10, time, true); lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true); lh.setUint16(26, nm.length, true);
    parts.push(lh.buffer, nm, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true); ch.setUint16(28, nm.length, true);
    ch.setUint32(42, off, true);
    central.push(ch.buffer, nm);
    off += 30 + nm.length + sz;
  }
  const cdSize = central.reduce((a, b) => a + b.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, end.buffer], {type:'application/zip'});
}
function photoLabels(){
  const m = {general:{no:'0', t:'일반사진', ord:0}};
  let ord = 1;
  FORM.forEach(g => g.items.forEach(it => { m[it.id] = {no:it.id === 'p1' ? '3.6' : it.no, t:it.t, ord:ord++}; }));
  GONG.forEach((g, i) => { m[g.id] = {no:'4.' + (i + 1), t:'공작물 ' + g.t, ord:ord++}; });
  STRENGTHEN.forEach((s, i) => { m[s.id] = {no:'5.' + (i + 1), t:'강화점검 ' + s.t, ord:ord++}; });
  return m;
}
async function exportPhotoZip(projId){
  const id = projId || PROJ;
  const st = id === PROJ ? S : loadState(id);
  const p = PROJS.find(x => x.id === id) || {};
  const photos = await collectPhotos(st, id);
  const pids = Object.keys(photos);
  if (!pids.length) return alert('저장된 사진이 없습니다.');
  const L = photoLabels();
  const clip = (s, n) => { s = safeName(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n) : s; };
  /* 사진ID = 항목ID_촬영시각_난수 → 항목 순서, 촬영 순서로 정렬 */
  const info = pids.map(pid => {
    const [item, ts] = pid.split('_');
    return {pid, item, ts:+ts || 0, lab:L[item] || {no:'9', t:item, ord:999}};
  }).sort((a, b) => a.lab.ord - b.lab.ord || a.ts - b.ts);
  const files = [], rows = [['번호', '항목', '설명', '파일명', '촬영시각']], seq = {}, used = new Set();
  for (const x of info) {
    seq[x.item] = (seq[x.item] || 0) + 1;
    const cap = clip(st.cap[x.pid], 40);
    let name = x.lab.no + '_' + clip(x.lab.t, 30) + '_' + String(seq[x.item]).padStart(2, '0') + (cap ? '_' + cap : '') + '.jpg';
    while (used.has(name)) name = name.replace(/\.jpg$/, '_.jpg');
    used.add(name);
    const bin = atob(photos[x.pid].split(',')[1] || '');
    files.push({name, data:Uint8Array.from(bin, c => c.charCodeAt(0))});
    rows.push([x.lab.no, x.lab.t, st.cap[x.pid] || '', name, x.ts ? new Date(x.ts).toLocaleString('ko-KR') : '']);
  }
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  files.unshift({name:'00_사진목록.csv', data:new TextEncoder().encode(csv)});
  const zname = safeName(st.meta.bname || p.name || '건축물') + '_사진_' + (st.meta.date || new Date().toISOString().slice(0, 10)) + '.zip';
  dl(zname, makeZip(files), 'application/zip', st.meta.bname || p.name);
}

/* JSON 불러오기 → 항상 새 프로젝트로 추가 (작성 중인 프로젝트를 덮어쓰지 않음) */
function importJSON(ev){
  const f = ev.target.files[0]; if (!f) return;
  ev.target.value = '';
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(r.result); if (!d || !d.state || !d.state.meta) throw new Error('점검 데이터 파일이 아닙니다'); }
    catch(e){ return alert('파일을 읽을 수 없습니다: ' + e.message); }
    const st = migrateState(Object.assign(blankState(), d.state));
    const id = newProjId();
    const name = st.meta.bname || (d.project && d.project.name) || f.name.replace(/\.json$/i, '');
    if (!lsPut(stKey(id), st)) return alert('저장공간이 부족해 불러올 수 없습니다.');
    PROJS.push({id, name, created:Date.now(), updated:Date.now()});
    lsPut(LS_PROJ, PROJS);
    const go = () => switchProject(id);
    if (d.photos && db && Object.keys(d.photos).length) {
      /* 사진이 많으면 저장에 시간이 걸리므로 트랜잭션 완료 후 전환 */
      const tx = db.transaction('photos','readwrite');
      const os = tx.objectStore('photos');
      Object.entries(d.photos).forEach(([k, v]) => os.put(v, pk(k, id)));
      tx.oncomplete = go;
      tx.onerror = () => { alert('사진 일부를 저장하지 못했습니다 (저장공간 부족 등).'); go(); };
    } else go();
  };
  r.readAsText(f);
}

function kvDB(){
  return new Promise(res => {
    try {
      const r = indexedDB.open('wrsc_lic', 1);
      r.onupgradeneeded = e => e.target.result.createObjectStore('kv');
      r.onsuccess = e => res(e.target.result);
      r.onerror = r.onblocked = () => res(null);
    } catch(e){ res(null); }
  });
}
function kvGet(d, k){
  return new Promise(res => {
    if (!d) return res(null);
    try { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }
    catch(e){ res(null); }
  });
}
function kvSet(d, k, v){ if (d) try { d.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch(e){} }

async function copyText(t){

  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);

}

async function licenseGate(){
  const kv = await kvDB();
  /* 두 저장소 중 하나라도 남아 있으면 같은 기기 ID 유지 */
  let dev = LIC.normId(lsGet(LK_DEV) || await kvGet(kv, LK_DEV));
  if (dev.length !== 16) dev = LIC.newDeviceId();
  LIC_DEV = dev;
  const kept = lsSet(LK_DEV, dev) | !!kv;
  kvSet(kv, LK_DEV, dev);

  /* 활성화 링크(...#license=코드) 또는 저장된 코드 확인 */
  const hm = location.hash.match(/[#&]license=([^&]+)/);
  const cands = [];
  if (hm) { cands.push(decodeURIComponent(hm[1])); try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} }
  cands.push(lsGet(LK_LIC), await kvGet(kv, LK_LIC));
  let last = null;
  for (const c of cands) {
    if (!c) continue;
    const r = LIC.check(dev, c, LIC_PUB);
    if (r.ok) { lsSet(LK_LIC, r.code); kvSet(kv, LK_LIC, r.code); return unlock(r); }
    if (!last || r.reason === 'expired') last = r;
  }
  return new Promise(resolve => showLock(dev, last, kv, !kept, r => resolve(unlock(r))));
}

  if (noStore) msg('⚠ 이 브라우저는 저장소를 사용할 수 없어 등록 상태가 유지되지 않습니다. (개인정보 보호 모드 해제 또는 다른 열기 방식 필요)', 'err');
  else if (last && last.reason === 'expired') msg('라이선스가 만료되었습니다 (' + LIC.fmtExp(last.exp) + '). 관리자에게 재발급을 요청하세요.', 'err');
  else if (last) msg('저장된 라이선스가 이 기기와 맞지 않습니다. 새 코드를 등록하세요.', 'err');
  const reqText = '[현장 체크리스트 라이선스 요청]\n기기 ID: ' + LIC.fmtId(dev) + '\n기기: ' + deviceKind();
  $('lk_copy').onclick = async () => msg(await copyText(reqText) ? '기기 ID를 복사했습니다. 메신저에 붙여넣어 관리자에게 보내세요.' : '복사하지 못했습니다. ID를 길게 눌러 직접 복사하세요.', 'ok');
  if ($('lk_share')) $('lk_share').onclick = () => navigator.share({text:reqText}).catch(() => {});
  if ($('lk_paste')) $('lk_paste').onclick = async () => { try { $('lk_code').value = (await navigator.clipboard.readText()).trim(); } catch(e){ msg('붙여넣기 권한이 없습니다. 입력칸을 길게 눌러 붙여넣으세요.', 'err'); } };
  $('lk_ok').onclick = () => {
    const code = $('lk_code').value.trim();
    if (!code) return msg('라이선스 코드를 입력하세요.', 'err');
    const r = LIC.check(dev, code, LIC_PUB);
    if (r.ok) { lsSet(LK_LIC, r.code); kvSet(kv, LK_LIC, r.code); done(r); }
    else msg(r.reason === 'expired' ? '만료된 라이선스입니다 (' + LIC.fmtExp(r.exp) + ').'
           : r.reason === 'format' ? '코드 형식이 올바르지 않습니다. 전체를 빠짐없이 붙여넣으세요.'
           : '이 기기용 코드가 아닙니다. 기기 ID를 다시 확인해 관리자에게 요청하세요.', 'err');
  };
  /* 잠금 화면이 열린 상태에서 활성화 링크를 누른 경우 (주소의 # 부분만 바뀌어 새로고침되지 않음) */
  const onHash = () => {
    const hm = location.hash.match(/[#&]license=([^&]+)/);
    if (!hm || !document.getElementById('lk_code')) return;
    $('lk_code').value = decodeURIComponent(hm[1]);
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
    $('lk_ok').click();
    if (!document.getElementById('lock')) window.removeEventListener('hashchange', onHash);
  };
  window.addEventListener('hashchange', onHash);
}

/* ====== 메신저 내부 브라우저 감지 ======
   카카오톡·네이버·인스타그램 등 앱 안의 브라우저는 파일 저장·공유가 제한되고
   저장공간도 Safari/Chrome과 분리되어 작성 내용이 유실될 수 있으므로 외부 브라우저로 넘김 */
const UA = navigator.userAgent;
const IN_APP = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps|everytimeApp|BAND\/|SamsungBrowser\/.*CrossApp|; wv\)/i.test(UA);
const IS_KAKAO = /KAKAOTALK/i.test(UA);
function inAppGate(){
  if (!IN_APP) return Promise.resolve();
  try { if (sessionStorage.getItem('inapp_ok')) return Promise.resolve(); } catch(e){}
  /* 카카오톡은 외부 브라우저로 여는 공식 주소 형식을 지원 (#license=… 활성화 코드도 그대로 전달) */
  const openExternal = () => {
    if (IS_KAKAO) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
    else if (/Android/i.test(UA))
      location.href = 'intent://' + location.host + location.pathname + '#Intent;scheme=https;package=com.android.chrome;end';
  };
  if (IS_KAKAO) openExternal();
  return new Promise(resolve => {
    const L = document.getElementById('lock');
    const browser = IS_IOS ? 'Safari' : 'Chrome';
    L.innerHTML =
      '<div class="card"><div class="hbar"><div></div><div></div><div></div><div></div><div></div><div></div></div><div class="body">' +
      '<h2>' + browser + '에서 열어 주세요</h2><div class="co">건축물관리점검 현장 체크리스트</div>' +
      '<div class="help" style="margin-top:0">지금은 <b>메신저 앱 안의 브라우저</b>로 열려 있습니다. 여기서는 <b>JSON·사진 ZIP·보고서 저장이 되지 않고</b>, 작성 내용과 사진이 사라질 수 있습니다.</div>' +
      ((IS_KAKAO || /Android/i.test(UA)) ? '<div class="row"><button class="primary" id="ia_open">' + browser + '로 열기</button></div>' : '') +
      '<div class="lbl">직접 여는 방법</div>' +
      '<div style="font-size:13px;line-height:1.6;color:#333">' +
      (IS_IOS ? '화면 아래(또는 위)의 <b>공유 [⬆] 또는 [···]</b> 버튼 → <b>[Safari로 열기]</b>를 누르세요.<br>또는 아래 [주소 복사] 후 Safari 주소창에 붙여넣으세요.'
              : '화면 오른쪽 위 <b>[⋮]</b> 메뉴 → <b>[다른 브라우저로 열기]</b>를 누르세요.<br>또는 아래 [주소 복사] 후 Chrome 주소창에 붙여넣으세요.') +
      '</div>' +
      '<div class="row"><button id="ia_copy">주소 복사</button></div>' +
      '<div class="msg" id="ia_msg"></div>' +
      '<div style="text-align:center;margin-top:14px"><a href="#" id="ia_stay" style="font-size:12px;color:#888">저장 기능 없이 여기서 계속 보기</a></div>' +
      '</div></div>';
    const $ = id => document.getElementById(id);
    if ($('ia_open')) $('ia_open').onclick = openExternal;
    $('ia_copy').onclick = async () => {
      const ok = await copyText(location.href);
      $('ia_msg').textContent = ok ? '주소를 복사했습니다. ' + browser + ' 주소창에 붙여넣으세요.' : '복사하지 못했습니다.';
      $('ia_msg').className = 'msg ' + (ok ? 'ok' : 'err');
    };
    $('ia_stay').onclick = e => {
      e.preventDefault();
      try { sessionStorage.setItem('inapp_ok', '1'); } catch(err){}
      resolve();
    };
  });
}

inAppGate().then(licenseGate).then(() => {
  showProjName();
  build();
  updateProgress();
  renderAllPhotos();
  const li = document.getElementById('licinfo');
  if (li && LIC_INFO) li.textContent = '라이선스: ' + (LIC_INFO.name || '등록됨') + ' · 만료 ' + LIC.fmtExp(LIC_INFO.exp) + ' · 기기 ID ' + LIC.fmtId(LIC_DEV);
});
</script>
