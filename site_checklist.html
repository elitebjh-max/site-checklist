<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="현장점검">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>건축물관리점검 현장 체크리스트</title>
<style>
  :root{
    --bar1:#000000; --bar2:#989998; --bar3:#BEBFBE; --bar4:#F1F2F1;
    --label:#D7D8D7; --accent:#1a1a1a; --line:#c9c9c9;
    --ok:#2e7d32; --warn:#c62828; --na:#757575;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',system-ui,sans-serif; background:#f4f4f4; color:#111; font-size:15px;
       padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);}
  header{position:sticky; top:0; z-index:50; background:#fff; border-bottom:2px solid #000; padding-top:env(safe-area-inset-top);}
  .hbar{display:flex; height:5px;}
  .hbar div{flex:1;}
  .hbar div:nth-child(1){background:var(--bar1);} .hbar div:nth-child(2),.hbar div:nth-child(3),.hbar div:nth-child(4){background:var(--bar2);} .hbar div:nth-child(5){background:var(--bar3);} .hbar div:nth-child(6){background:var(--bar4);}
  .htop{display:flex; align-items:center; justify-content:space-between; padding:8px 12px;}
  .htop h1{font-size:16px; margin:0; font-weight:700;}
  .htop .sub{font-size:11px; color:#666;}
  .progress{padding:0 12px 8px;}
  .pbar{height:8px; background:#e2e2e2; border-radius:4px; overflow:hidden;}
  .pfill{height:100%; background:linear-gradient(90deg,#444,#000); width:0%;}
  .ptext{font-size:11px; color:#555; margin-top:3px; display:flex; justify-content:space-between;}
  main{max-width:760px; margin:0 auto; padding:10px 10px calc(90px + env(safe-area-inset-bottom));}
  details.sec{background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; overflow:hidden;}
  details.sec>summary{list-style:none; cursor:pointer; padding:11px 12px; background:var(--label); font-weight:700; font-size:14.5px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); gap:8px;}
  details.sec>summary::-webkit-details-marker{display:none;}
  .cnt{font-size:12px; font-weight:400; color:#444; background:#fff; border-radius:10px; padding:2px 8px; border:1px solid #bbb; white-space:nowrap;}
  .cnt.done{background:#e6f4e6; color:var(--ok); border-color:var(--ok);}
  .ref{font-size:10.5px; font-weight:400; color:#555; display:block;}
  .item{border-bottom:1px solid #e5e5e5; padding:10px 12px;}
  .item:last-child{border-bottom:none;}
  .ititle{font-weight:700; font-size:14px; display:flex; justify-content:space-between; gap:8px; align-items:baseline;}
  .ititle .no{color:#0b57a4; margin-right:4px;}
  .ititle .law{font-size:11px; color:#777; font-weight:400; white-space:nowrap;}
  .q{margin:8px 0 2px;}
  .qtext{font-size:13.5px; margin-bottom:5px; color:#222;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{border:1px solid #aaa; border-radius:16px; padding:5px 12px; font-size:13px; background:#fff; cursor:pointer; user-select:none;}
  .chip.sel{background:#111; color:#fff; border-color:#111; font-weight:700;}
  .chip.sel.bad{background:var(--warn); border-color:var(--warn);}
  .chip.sel.na{background:var(--na); border-color:var(--na);}
  .cmp{background:#f4f8ff; border:1px solid #c6d8f0; border-radius:7px; padding:7px 9px; margin-top:8px;}
  .cmp .qtext{font-size:12.5px; font-weight:700; color:#0b57a4; margin-bottom:5px;}
  .cntrow{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .cntrow label{font-size:12.5px; color:#444; font-weight:700;}
  .cntrow input{width:80px; border:1px solid #bbb; border-radius:6px; padding:6px; font:inherit; font-size:13px; text-align:center;}
  textarea{width:100%; border:1px solid #bbb; border-radius:6px; padding:7px; font:inherit; font-size:13px; min-height:34px; resize:vertical; margin-top:6px; background:#fcfcfc;}
  input[type=text],input[type=date],input[type=number]{width:100%; border:1px solid #bbb; border-radius:6px; padding:8px; font:inherit; font-size:14px; background:#fcfcfc;}
  .field{margin-bottom:9px;}
  .field label{display:block; font-size:12px; font-weight:700; color:#444; margin-bottom:3px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; padding:10px 12px;}
  .grid2 .full{grid-column:1/3;}
  .subhead{padding:7px 12px; font-size:12.5px; font-weight:700; color:#fff; background:#666;}
  .photos{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .ph{position:relative; width:74px;}
  .ph img{width:74px; height:74px; object-fit:cover; border-radius:6px; border:1px solid #ccc; display:block;}
  .ph .del{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:#c62828; color:#fff; border:none; font-size:12px; line-height:1; cursor:pointer;}
  .ph input{width:74px; font-size:10px; border:none; border-bottom:1px solid #ddd; background:transparent; padding:2px 0;}
  .addph{position:relative; display:inline-flex; align-items:center; gap:5px; margin-top:8px; margin-right:6px; font-size:12.5px; border:1px dashed #888; border-radius:6px; padding:6px 10px; background:#fafafa; cursor:pointer;}
  .memo-label{font-size:11.5px; color:#666; margin-top:6px;}
  footer{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #ccc; display:flex; gap:8px; z-index:50;
         padding:8px calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));}
  body.kb footer{display:none;}  /* 모바일 키보드 표시 중에는 하단 버튼 숨김 */
  footer button{flex:1; padding:11px 4px; font:inherit; font-size:13.5px; font-weight:700; border-radius:8px; border:1px solid #333; background:#fff; cursor:pointer;}
  footer button.primary{background:#111; color:#fff;}
  .note{font-size:12px; color:#555; background:#fffbe6; border:1px solid #e6d87a; border-radius:6px; padding:8px 10px; margin:10px 12px;}
  .tip{font-size:12px; color:#8a6d00; background:#fff9e0; border-radius:5px; padding:5px 8px; margin-top:5px;}
  .toggle-row{padding:10px 12px; border-bottom:1px solid #e5e5e5;}
  .toggle-row label{font-size:13.5px; font-weight:700;}
  .hidden{display:none!important;}
  /* iOS Safari: display:none 인 file input 은 label 탭이 동작하지 않는 경우가 있어 시각적으로만 숨김 */
  .vh{position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); border:0; opacity:0;}
  .missing{outline:2px solid var(--warn); outline-offset:-2px; border-radius:4px;}
  @media (max-width:480px){ .grid2{grid-template-columns:1fr;} .grid2 .full{grid-column:1;} }
  @media (pointer:coarse){
    .chip{padding:7px 14px; font-size:14px;}
    .addph{padding:8px 12px; font-size:13.5px;}
    .ph .del{width:26px; height:26px; font-size:15px; top:-8px; right:-8px;}
  }
  /* 사진 크게 보기 */
  #lightbox{position:fixed; inset:0; z-index:900; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center;
            padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  #lightbox img{max-width:100%; max-height:100%; object-fit:contain;}
  #lightbox .close{position:absolute; top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right)); width:40px; height:40px; border-radius:50%;
            border:none; background:#fff; color:#000; font-size:22px; line-height:1;}
  /* 파일 저장 준비 안내 (iOS 공유시트 재시도용) */
  .modal{position:fixed; inset:0; z-index:950; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal .box{background:#fff; border-radius:12px; padding:18px; max-width:360px; width:100%; text-align:center;}
  .modal .box p{margin:0 0 14px; font-size:14px;}
  .modal .box button{display:block; width:100%; margin-top:8px; padding:12px; font:inherit; font-weight:700; border-radius:8px; border:1px solid #333; background:#fff;}
  .modal .box button.primary{background:#111; color:#fff;}
  /* 라이선스 잠금 화면 */
  body.locked header, body.locked main, body.locked footer{display:none!important;}
  #lock{position:fixed; inset:0; z-index:1000; background:#f4f4f4; overflow:auto; -webkit-overflow-scrolling:touch;
        padding:calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));}
  #lock .card{max-width:440px; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  #lock .body{padding:18px;}
  #lock h2{margin:0 0 4px; font-size:18px;}
  #lock .co{font-size:12px; color:#666; margin-bottom:14px;}
  #lock .lbl{font-size:12px; font-weight:700; color:#444; margin:14px 0 5px;}
  #lock .devid{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:21px; font-weight:700; letter-spacing:1px; background:#f1f2f1;
        border:1px solid #ccc; border-radius:8px; padding:10px; text-align:center; user-select:all; -webkit-user-select:all;}
  #lock .row{display:flex; gap:8px; margin-top:8px;}
  #lock button{flex:1; padding:11px 6px; font:inherit; font-size:14px; font-weight:700; border-radius:8px; border:1px solid #333; background:#fff; color:#111; cursor:pointer;}
  #lock button.primary{background:#111; color:#fff;}
  #lock textarea{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:16px; min-height:90px; word-break:break-all;}
  #lock .msg{font-size:13px; margin-top:10px; min-height:18px; font-weight:700;}
  #lock .msg.err{color:var(--warn);} #lock .msg.ok{color:var(--ok);}
  #lock .help{font-size:12px; color:#555; line-height:1.55; margin-top:14px; background:#fffbe6; border:1px solid #e6d87a; border-radius:6px; padding:8px 10px;}
</style>
</head>
<body class="locked">
<div id="lock"></div>
<header>
  <div class="hbar"><div></div><div></div><div></div><div></div><div></div><div></div></div>
  <div class="htop">
    <h1>건축물관리점검 현장 체크리스트</h1>
    <span class="sub">우림구조엔지니어링</span>
  </div>
  <div class="progress">
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
    <div class="ptext"><span id="ptext">0 / 0 항목</span><span id="savestat"></span></div>
  </div>
</header>
<main id="main"></main>
<footer>
  <button onclick="showMissing()">미작성 확인</button>
  <button onclick="exportJSON()">JSON 저장</button>
  <button class="primary" onclick="exportReport()">요약보고서(HTML)</button>
</footer>
<input type="file" id="importFile" accept=".json,application/json" class="vh" onchange="importJSON(event)">

<script>
/* ============================================================
   번호체계는 표준 세부점검표(3.1.1~3.5.10)와 1:1 대응.
   각 항목 카드 = 보고서 "3장 점검세부항목별 점검내용" 1개 페이지
                = 별지 제2호 서식의 소항목 1칸.
   ============================================================ */

/* ====== 선택지 정의 ====== */
const CH = {
  A: ['적합','부적합','도면없음','해당없음'],   /* 법규유지형 — 별지2 기입 시 '도면없음'은 해당없음(-) 처리 */
  A3:['적합','부적합','해당없음'],             /* 별지2와 동일 3택 (내진·화재 마감재 등) */
  B: ['양호','보통','미흡','불량','해당없음'],
  C: ['인증','재인증','만료','해당없음'],
  Y: ['예','아니오','기타','해당없음'],
  E: ['우수','양호','보통','미흡','불량'],
  E6:['우수','양호','보통','미흡','불량','해당없음'],
  P: ['적합','부적합'],
  CMP:['개선필요','해당없음'],
  YN:['있음','없음'],
  AG:['동의함','동의하지 않음']
};
const BADSET = new Set(['부적합','미흡','불량','아니오','만료','개선필요']);
const NASET = new Set(['해당없음','기타','도면없음','없음']);

/* ====== 점검항목 (표준 세부점검표 3.1.1 ~ 3.5.10 + 별지2 제6면) ====== */
const FORM = [
 {sec:'3.1 법규유지 ― 대지', ref:'별지2 제1면 · 세부점검표 3.1.1~3.1.5', items:[

   tip:'조경면적 변경 유형: 실외기·간이시설물·쓰레기분리시설·식재훼손·바닥포장 등. 기준면적은 건축물대장 기재사항으로 작성'},
  {id:'d2', no:'3.1.2', t:'옥상의 조경', law:'건축법 제42조', qs:[['옥상조경 면적 유지 여부','A']]},

  {id:'d4', no:'3.1.4', t:'대지와 도로의 관계', law:'건축법 제44조', qs:[['대지와 도로의 관계 유지 여부','A']],
   tip:'접도 폭·길이 확인'},
  {id:'d5', no:'3.1.5', t:'건축선 유지', law:'건축법 제47조', qs:[['건축선 유지 여부','A']],
   tip:'건축선 침범 점유물(입점매장 진열대·좌판 등) 확인'},
 ]},
 {sec:'3.1 법규유지 ― 높이 및 형태', ref:'별지2 제1면 · 세부점검표 3.1.6~3.1.11', items:[

   tip:'무단 증축·데크·천막·캐노피 설치 여부 확인'},
  {id:'h2', no:'3.1.7', t:'용적률', law:'건축법 제56조', qs:[['용적률 유지 여부','A']],

  {id:'h5', no:'3.1.10', t:'일조확보 높이제한', law:'건축법 제61조', qs:[['일조확보 높이제한 유지 여부','A']],
   tip:'전용·일반주거지역만 해당'},
  {id:'h6', no:'3.1.11', t:'건축물 높이·외부형태', law:'건축법 제55~61조', qs:[['건축물 높이·외부형태 유지 여부','A']]},
 ]},

  {id:'c3', no:'3.1.14', t:'조경기준', law:'건축법 제53조의2', qs:[['조경기준 유지 여부','B']]},
  {id:'c4', no:'3.1.15', t:'조명기준', law:'건축법 제53조의2', qs:[['조명기준 유지 여부','B']]},
  {id:'c5', no:'3.1.16', t:'세부기준 1', law:'건축법 제53조의2', qs:[
    ['범죄예방기준 유지 여부 (100세대 이상 아파트 대상)','B'],
    ['범죄예방기준 유지 여부 (다가구·다세대·연립주택, 100세대 미만 아파트, 오피스텔 대상)','B']]},
  {id:'c6', no:'3.1.17', t:'세부기준 2', law:'건축법 제53조의2', qs:[

    ['범죄예방기준 유지 여부 (24시간 일용품 판매 소매점 대상)','B'],
    ['범죄예방기준 유지 여부 (다중생활시설 대상)','B']]},
 ]},
 {sec:'3.2 기능유지 ― 급/배수', ref:'별지2 제2면 · 세부점검표 3.2.1~3.2.2', items:[
  {id:'w1', no:'3.2.1', t:'급수성능', law:'건축법 제62조', qs:[

    ['급수펌프 및 밸브 작동상태 유지 여부','B']],
   tip:'수도꼭지 급수테스트, 저수조 재질·청소기록, 펌프 외관·이상소음 확인. 기계설비법 성능점검 실시 시 생략 가능'},

function chipRowGeneric(store, key, choiceKey, onSel){
  const wrap = document.createElement('div'); wrap.className = 'chips';
  CH[choiceKey].forEach(c => {
    const b = document.createElement('span'); b.className = 'chip'; b.textContent = c;
    if (store[key] === c) b.classList.add('sel', BADSET.has(c) ? 'bad' : NASET.has(c) ? 'na' : 'x');
    b.onclick = () => {
      store[key] = (store[key] === c) ? undefined : c;
      wrap.querySelectorAll('.chip').forEach(x => x.className = 'chip');
      if (store[key]) b.classList.add('sel', BADSET.has(c) ? 'bad' : NASET.has(c) ? 'na' : 'x');
      save();
      if (onSel) onSel(store[key]);
    };
    wrap.appendChild(b);
  });
  return wrap;
}
const chipRow = (qid, ck) => chipRowGeneric(S.ans, qid, ck);

function memoBox(id, key, ph){
  const t = document.createElement('textarea'); t.placeholder = ph;
  t.value = (S.memo[id] && S.memo[id][key]) || '';
  t.oninput = () => { S.memo[id] = S.memo[id] || {}; S.memo[id][key] = t.value; save(); };
  return t;
}

function photoBlock(itemId){
  const box = document.createElement('div');
  const list = document.createElement('div'); list.className = 'photos'; list.id = 'ph_' + itemId;
  box.appendChild(list);
  /* capture 속성이 있으면 iOS·Android는 카메라만 열리므로 '촬영'과 '앨범'을 분리 */
  const mk = (text, cam) => {
    const add = document.createElement('label'); add.className = 'addph'; add.textContent = text;
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.className = 'vh';
    if (cam) inp.setAttribute('capture', 'environment'); else inp.multiple = true;
    inp.onchange = async ev => {
      for (const f of Array.from(ev.target.files)) await addPhoto(itemId, f);
      ev.target.value = '';
    };
    add.appendChild(inp);
    box.appendChild(add);
  };
  if (IS_TOUCH) { mk('📷 촬영', true); mk('🖼 앨범에서 선택', false); }
  else mk('📷 사진 추가', false);
  return box;
}
function showPhoto(src){
  const lb = document.createElement('div'); lb.id = 'lightbox';
  const im = document.createElement('img'); im.src = src;
  const x = document.createElement('button'); x.className = 'close'; x.textContent = '×';
  lb.onclick = () => lb.remove();
  lb.appendChild(im); lb.appendChild(x);
  document.body.appendChild(lb);
}
async function addPhoto(itemId, file){
  if (!db) { alert('이 열기 방식에서는 사진 저장이 지원되지 않습니다.\n' +
    (IS_IOS ? 'Safari로 웹주소를 열어 홈 화면에 추가한 뒤 사용하거나(개인정보 보호 브라우징 제외), ' : 'Chrome 주소창에 file:/// 경로로 열거나, ') +
    '휴대폰 카메라로 직접 촬영 후 사무실에서 정리해 주세요.'); return; }
  const img = await shrink(file, 1600, 0.82);
  if (!img) { alert('이미지를 읽을 수 없습니다: ' + file.name); return; }
  const pid = itemId + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  db.transaction('photos','readwrite').objectStore('photos').put(img, pid);
  S.cap[pid] = ''; save();
  renderPhotos(itemId);
}
function shrink(file, maxW, q){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxW / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL('image/jpeg', q));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); res(null); };
    img.src = URL.createObjectURL(file);
  });
}
function renderPhotos(itemId){
  const list = document.getElementById('ph_' + itemId);
  if (!list || !db) return;
  const tx = db.transaction('photos').objectStore('photos');
  const keys = Object.keys(S.cap).filter(k => k.startsWith(itemId + '_'));
  list.innerHTML = '';
  keys.forEach(pid => {
    tx.get(pid).onsuccess = e => {
      if (!e.target.result) return;
      const d = document.createElement('div'); d.className = 'ph';
      const im = document.createElement('img'); im.src = e.target.result;
      im.onclick = () => showPhoto(im.src);
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '×';
      del.onclick = () => { if (confirm('사진을 삭제할까요?')) { db.transaction('photos','readwrite').objectStore('photos').delete(pid); delete S.cap[pid]; save(); renderPhotos(itemId); } };
      const cap = document.createElement('input'); cap.placeholder = '위치/내용'; cap.value = S.cap[pid] || '';
      cap.oninput = () => { S.cap[pid] = cap.value; save(); };
      d.appendChild(im); d.appendChild(del); d.appendChild(cap);
      list.appendChild(d);
    };
  });
}
function renderAllPhotos(){
  document.querySelectorAll('[id^=ph_]').forEach(el => renderPhotos(el.id.slice(3)));
}

  return it;
}

/* ====== 진행률 / 미작성 ====== */
function itemUnits(){
  /* [key, kind] 목록: kind ans|cmp|oth */
  const u = [];
  FORM.forEach(g => g.items.forEach(it => {
    it.qs.forEach((q, qi) => u.push(['ans', it.id + '_q' + qi, it.id]));
    if (!it.nocmp) u.push(['cmp', it.id, it.id]);
  }));
  OTHERS.forEach((o, i) => u.push(['oth', i, 'oth' + i]));
  if (S.hasGong) GONG.forEach(g => u.push(['ans', g.id + '_q0', g.id]));
  if (S.use20) STRENGTHEN.forEach(it => it.qs.forEach((q, qi) => u.push(['ans', it.id + '_q' + qi, it.id])));
  return u;
}
function unitDone([kind, key]){
  if (kind === 'ans') return !!S.ans[key];
  if (kind === 'cmp') return !!S.cmp[key];
  return !!S.others[key];
}
function updateProgress(){
  const units = itemUnits();
  const done = units.filter(unitDone).length;
  document.getElementById('pfill').style.width = (units.length ? done / units.length * 100 : 0) + '%';
  document.getElementById('ptext').textContent = done + ' / ' + units.length + ' 항목';
  FORM.forEach((g, gi) => {
    const gu = [];
    g.items.forEach(it => {
      it.qs.forEach((q, qi) => gu.push(['ans', it.id + '_q' + qi]));
      if (!it.nocmp) gu.push(['cmp', it.id]);
    });
    const d = gu.filter(unitDone).length;
    const el = document.getElementById('cnt_g' + gi);
    if (el) { el.textContent = d + '/' + gu.length; el.className = 'cnt' + (d === gu.length ? ' done' : ''); }
  });
  const od = OTHERS.map((o, i) => ['oth', i]).filter(unitDone).length;
  const oe = document.getElementById('cnt_oth');
  if (oe) { oe.textContent = od + '/' + OTHERS.length; oe.className = 'cnt' + (od === OTHERS.length ? ' done' : ''); }
}
function showMissing(){
  document.querySelectorAll('.missing').forEach(e => e.classList.remove('missing'));
  let first = null;
  const mark = id => {
    const el = document.getElementById('item_' + id);
    if (!el) return;
    el.classList.add('missing');
    el.closest('details').open = true;
    if (!first) first = el;
  };
  FORM.forEach(g => g.items.forEach(it => {
    const missQ = it.qs.some((q, qi) => !S.ans[it.id + '_q' + qi]);
    const missC = !it.nocmp && !S.cmp[it.id];
    if (missQ || missC) mark(it.id);
  }));
  OTHERS.forEach((o, i) => { if (!S.others[i]) mark('oth' + i); });
  if (S.hasGong) GONG.forEach(g => { if (!S.ans[g.id + '_q0']) mark(g.id); });
  if (S.use20) STRENGTHEN.forEach(it => { if (it.qs.some((q, qi) => !S.ans[it.id + '_q' + qi])) mark(it.id); });
  if (first) first.scrollIntoView({behavior:'smooth', block:'center'});
  else alert('모든 항목이 작성되었습니다!');
}

/* ====== 내보내기 ====== */
async function collectPhotos(){
  return new Promise(res => {
    const out = {};
    const keys = Object.keys(S.cap);
    if (!keys.length || !db) return res(out);
    let n = 0;
    const tx = db.transaction('photos').objectStore('photos');
    keys.forEach(pid => {
      tx.get(pid).onsuccess = e => {
        if (e.target.result) out[pid] = e.target.result;
        if (++n === keys.length) res(out);
      };
    });
  });
}
const safeName = s => String(s).replace(/[\\/:*?"<>|\r\n]+/g, '_').trim();
function dlLink(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
/* iOS(특히 홈 화면 앱 모드)는 다운로드가 불안정하므로 공유시트(파일에 저장·카카오톡·메일)를 사용 */
async function dl(name, content, mime){
  const blob = new Blob([content], {type: mime});
  let file = null;
  try { file = new File([blob], name, {type: mime}); } catch(e){}
  const canShare = IS_IOS && file && navigator.canShare && navigator.canShare({files:[file]});
  if (!canShare) return dlLink(name, blob);
  try {
    await navigator.share({files:[file], title:name});
  } catch(e) {
    if (e.name === 'AbortError') return;                 /* 사용자가 공유시트를 닫음 */
    /* 사진을 읽는 동안 탭 동작 유효시간이 지나 거부된 경우 — 버튼을 한 번 더 눌러 공유 */
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = '<div class="box"><p><b>파일 준비 완료</b><br><span style="font-size:12.5px;color:#555"></span></p>' +
                  '<button class="primary">공유 / 파일에 저장</button><button>다운로드</button><button>닫기</button></div>';
    m.querySelector('span').textContent = name;
    const [bShare, bDl, bClose] = m.querySelectorAll('button');
    bShare.onclick = () => { m.remove(); navigator.share({files:[file], title:name}).catch(() => {}); };
    bDl.onclick = () => { m.remove(); dlLink(name, blob); };
    bClose.onclick = () => m.remove();
    document.body.appendChild(m);
  }
}
async function exportJSON(){
  const photos = await collectPhotos();
  const name = safeName(S.meta.bname || '건축물') + '_점검데이터_' + (S.meta.date || new Date().toISOString().slice(0,10)) + '.json';
  dl(name, JSON.stringify({state:S, photos}, null, 1), 'application/json');
}
function importJSON(ev){
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      S = d.state;
      localStorage.setItem(LS_KEY, JSON.stringify(S));
      if (d.photos && db && Object.keys(d.photos).length) {
        /* 사진이 많으면 저장에 시간이 걸리므로 트랜잭션 완료 후 새로고침 */
        const tx = db.transaction('photos','readwrite');
        const st = tx.objectStore('photos');
        Object.entries(d.photos).forEach(([k, v]) => st.put(v, k));
        tx.oncomplete = () => location.reload();
        tx.onerror = () => { alert('사진 일부를 저장하지 못했습니다 (저장공간 부족 등).'); location.reload(); };
      } else setTimeout(() => location.reload(), 300);
    } catch(e){ alert('파일을 읽을 수 없습니다: ' + e.message); }
  };
  r.readAsText(f);
}

    const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

    dv.setUint32(bl - 8, Math.floor(l / 0x20000000)); dv.setUint32(bl - 4, (l << 3) >>> 0);

    for (let o = 0; o < bl; o += 64) {
      for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);

        const a = W[i - 15], b = W[i - 2];
        W[i] = (W[i - 16] + (ror(a, 7) ^ ror(a, 18) ^ (a >>> 3)) + W[i - 7] + (ror(b, 17) ^ ror(b, 19) ^ (b >>> 10))) | 0;

        const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }
    const out = new Uint8Array(32), ov = new DataView(out.buffer);
    H.forEach((v, i) => ov.setUint32(i * 4, v >>> 0));
    return out;
  }
  /* NIST P-256 */
  const P = 0xffffffff00000001000000000000000000000000ffffffffffffffffffffffffn;
  const N = 0xffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551n;
  const G = [0x6b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c296n,
             0x4fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5n];
  const mod = (a, m) => { a %= m; return a < 0n ? a + m : a; };
  function inv(a, m){
    let t = 0n, nt = 1n, r = m, nr = mod(a, m);
    while (nr) { const q = r / nr; [t, nt] = [nt, t - q * nt]; [r, nr] = [nr, r - q * nr]; }
    return mod(t, m);
  }
  function add(p1, p2){
    if (!p1) return p2; if (!p2) return p1;
    const [x1, y1] = p1, [x2, y2] = p2; let l;
    if (x1 === x2) {
      if (mod(y1 + y2, P) === 0n) return null;
      l = mod((3n * x1 * x1 - 3n) * inv(2n * y1, P), P);
    } else l = mod((y2 - y1) * inv(x2 - x1, P), P);
    const x3 = mod(l * l - x1 - x2, P);
    return [x3, mod(l * (x1 - x3) - y1, P)];
  }
  function mul(k, pt){ let r = null, q = pt; while (k > 0n) { if (k & 1n) r = add(r, q); q = add(q, q); k >>= 1n; } return r; }
  const toBig = b => { let x = 0n; for (const v of b) x = (x << 8n) | BigInt(v); return x; };
  const toBytes32 = x => { const b = new Uint8Array(32); for (let i = 31; i >= 0; i--) { b[i] = Number(x & 0xffn); x >>= 8n; } return b; };
  function verify(m, sig, Q){
    if (!sig || sig.length !== 64) return false;
    const r = toBig(sig.slice(0, 32)), s = toBig(sig.slice(32));
    if (r <= 0n || r >= N || s <= 0n || s >= N) return false;
    const e = toBig(sha256(m)), w = inv(s, N);
    const X = add(mul(mod(e * w, N), G), mul(mod(r * w, N), Q));
    return !!X && mod(X[0], N) === r;
  }
  function sign(m, d){
    const e = toBig(sha256(m));
    for (;;) {
      const k = toBig(crypto.getRandomValues(new Uint8Array(32)));
      if (k <= 0n || k >= N) continue;
      const r = mod(mul(k, G)[0], N); if (!r) continue;
      const s = mod(inv(k, N) * (e + r * d), N); if (!s) continue;
      const out = new Uint8Array(64); out.set(toBytes32(r)); out.set(toBytes32(s), 32);
      return out;
    }
  }
  /* 인코딩 */
  const utf8 = s => new TextEncoder().encode(s);
  const b64u = b => { let s = ''; b.forEach(v => s += String.fromCharCode(v)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';   /* Crockford Base32 (I·L·O·U 제외) */
  function newDeviceId(){
    let bits = 0, val = 0, out = '';
    for (const v of crypto.getRandomValues(new Uint8Array(10))) {
      val = (val << 8) | v; bits += 8;
      while (bits >= 5) { out += B32[(val >>> (bits - 5)) & 31]; bits -= 5; }
      val &= (1 << bits) - 1;
    }
    return out;
  }
  const normId = s => String(s || '').toUpperCase().replace(/O/g, '0').replace(/[IL]/g, '1').replace(/[^0-9A-Z]/g, '');
  const fmtId = id => id.replace(/(.{4})(?=.)/g, '$1-');
  const fmtExp = e => e === '0' ? '무기한' : e.slice(0, 4) + '.' + e.slice(4, 6) + '.' + e.slice(6);
  const TAG = 'WRSC1';
  const msg = (dev, exp, name) => utf8(TAG + '|' + dev + '|' + exp + '|' + name);
  const today = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
  /* 라이선스 코드 = 만료일(YYYYMMDD|0) . 사용자명(base64url) . 서명(base64url 64B) */
  function parse(code){
    const c = String(code || '').replace(/\s+/g, ''), p = c.split('.');
    if (p.length !== 3 || !/^(0|\d{8})$/.test(p[0])) return null;
    try { return {exp:p[0], name:new TextDecoder().decode(unb64u(p[1])), sig:unb64u(p[2]), code:c}; }
    catch(e){ return null; }
  }
  function check(dev, code, Q){
    const L = parse(code);
    if (!L) return {ok:false, reason:'format'};
    if (!verify(msg(dev, L.exp, L.name), L.sig, Q)) return {ok:false, reason:'sig'};
    if (L.exp !== '0' && today() > +L.exp) return {ok:false, reason:'expired', exp:L.exp, name:L.name};
    return {ok:true, exp:L.exp, name:L.name, code:L.code};
  }
  function issue(dev, exp, name, d){ return exp + '.' + b64u(utf8(name)) + '.' + b64u(sign(msg(dev, exp, name), d)); }
  return {sha256, verify, sign, check, issue, parse, newDeviceId, normId, fmtId, fmtExp, mul, G, toBig, toBytes32};
})();
const LIC_PUB = [0xfe9e5dbace54526364b04b3d6460a0ae7ad872f3bc3772d5644824f36e730b85n, 0x19e1e50c531ec9563564f2c55e433bd2bb6a4d558a33a2b511a7a2136865189dn];
const LK_DEV = 'wrsc_device', LK_LIC = 'wrsc_license';
let LIC_INFO = null, LIC_DEV = '';

const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch(e){ return false; } };
function kvDB(){
  return new Promise(res => {
    try {
      const r = indexedDB.open('wrsc_lic', 1);
      r.onupgradeneeded = e => e.target.result.createObjectStore('kv');
      r.onsuccess = e => res(e.target.result);
      r.onerror = r.onblocked = () => res(null);
    } catch(e){ res(null); }
  });
}
function kvGet(d, k){
  return new Promise(res => {
    if (!d) return res(null);
    try { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }
    catch(e){ res(null); }
  });
}
function kvSet(d, k, v){ if (d) try { d.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch(e){} }

async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e){}
  const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove(); return ok;
}
const deviceKind = () => IS_IOS ? (/iPhone|iPod/.test(navigator.userAgent) ? 'iPhone' : 'iPad')
  : /Android/.test(navigator.userAgent) ? 'Android' : /Windows/.test(navigator.userAgent) ? 'Windows PC' : /Mac/.test(navigator.userAgent) ? 'Mac' : '기타';

async function licenseGate(){
  const kv = await kvDB();
  /* 두 저장소 중 하나라도 남아 있으면 같은 기기 ID 유지 */
  let dev = LIC.normId(lsGet(LK_DEV) || await kvGet(kv, LK_DEV));
  if (dev.length !== 16) dev = LIC.newDeviceId();
  LIC_DEV = dev;
  const kept = lsSet(LK_DEV, dev) | !!kv;
  kvSet(kv, LK_DEV, dev);

  /* 활성화 링크(...#license=코드) 또는 저장된 코드 확인 */
  const hm = location.hash.match(/[#&]license=([^&]+)/);
  const cands = [];
  if (hm) { cands.push(decodeURIComponent(hm[1])); try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} }
  cands.push(lsGet(LK_LIC), await kvGet(kv, LK_LIC));
  let last = null;
  for (const c of cands) {
    if (!c) continue;
    const r = LIC.check(dev, c, LIC_PUB);
    if (r.ok) { lsSet(LK_LIC, r.code); kvSet(kv, LK_LIC, r.code); return unlock(r); }
    if (!last || r.reason === 'expired') last = r;
  }
  return new Promise(resolve => showLock(dev, last, kv, !kept, r => resolve(unlock(r))));
}
function unlock(r){
  LIC_INFO = r;
  document.getElementById('lock').remove();
  document.body.classList.remove('locked');
  return r;
}
function showLock(dev, last, kv, noStore, done){
  const L = document.getElementById('lock');
  L.innerHTML =
    '<div class="card"><div class="hbar"><div></div><div></div><div></div><div></div><div></div><div></div></div><div class="body">' +
    '<h2>건축물관리점검 현장 체크리스트</h2><div class="co">우림구조엔지니어링 · 허가된 기기 전용</div>' +
    '<div class="lbl">이 기기의 ID</div><div class="devid" id="lk_dev"></div>' +
    '<div class="row"><button id="lk_copy">ID 복사</button>' + (navigator.share ? '<button id="lk_share">ID 보내기</button>' : '') + '</div>' +
    '<div class="lbl">라이선스 코드</div><textarea id="lk_code" placeholder="관리자에게 받은 코드를 붙여넣으세요" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>' +
    '<div class="row">' + (navigator.clipboard && navigator.clipboard.readText ? '<button id="lk_paste">붙여넣기</button>' : '') +
    '<button class="primary" id="lk_ok">등록</button></div>' +
    '<div class="msg" id="lk_msg"></div>' +
    '<div class="help">① 위 <b>기기 ID</b>를 관리자에게 보내세요.<br>② 관리자가 보내준 <b>라이선스 코드</b>를 붙여넣고 [등록]을 누르세요. (활성화 링크를 받았다면 링크를 누르면 바로 등록됩니다)<br>' +
    '※ 브라우저 데이터를 삭제하거나 다른 브라우저·기기에서 열면 기기 ID가 바뀌어 재발급이 필요합니다.' +
    (IS_IOS ? '<br>※ iPhone/iPad: <b>홈 화면에 추가한 아이콘으로 실행한 상태에서</b> 기기 ID를 확인·등록하세요 (Safari와 홈 화면 앱은 저장소가 따로입니다).' : '') +
    '</div></div></div>';
  const $ = id => document.getElementById(id);
  const msg = (t, cls) => { $('lk_msg').textContent = t; $('lk_msg').className = 'msg ' + (cls || ''); };
  $('lk_dev').textContent = LIC.fmtId(dev);
  if (noStore) msg('⚠ 이 브라우저는 저장소를 사용할 수 없어 등록 상태가 유지되지 않습니다. (개인정보 보호 모드 해제 또는 다른 열기 방식 필요)', 'err');
  else if (last && last.reason === 'expired') msg('라이선스가 만료되었습니다 (' + LIC.fmtExp(last.exp) + '). 관리자에게 재발급을 요청하세요.', 'err');
  else if (last) msg('저장된 라이선스가 이 기기와 맞지 않습니다. 새 코드를 등록하세요.', 'err');
  const reqText = '[현장 체크리스트 라이선스 요청]\n기기 ID: ' + LIC.fmtId(dev) + '\n기기: ' + deviceKind();
  $('lk_copy').onclick = async () => msg(await copyText(reqText) ? '기기 ID를 복사했습니다. 메신저에 붙여넣어 관리자에게 보내세요.' : '복사하지 못했습니다. ID를 길게 눌러 직접 복사하세요.', 'ok');
  if ($('lk_share')) $('lk_share').onclick = () => navigator.share({text:reqText}).catch(() => {});
  if ($('lk_paste')) $('lk_paste').onclick = async () => { try { $('lk_code').value = (await navigator.clipboard.readText()).trim(); } catch(e){ msg('붙여넣기 권한이 없습니다. 입력칸을 길게 눌러 붙여넣으세요.', 'err'); } };
  $('lk_ok').onclick = () => {
    const code = $('lk_code').value.trim();
    if (!code) return msg('라이선스 코드를 입력하세요.', 'err');
    const r = LIC.check(dev, code, LIC_PUB);
    if (r.ok) { lsSet(LK_LIC, r.code); kvSet(kv, LK_LIC, r.code); done(r); }
    else msg(r.reason === 'expired' ? '만료된 라이선스입니다 (' + LIC.fmtExp(r.exp) + ').'
           : r.reason === 'format' ? '코드 형식이 올바르지 않습니다. 전체를 빠짐없이 붙여넣으세요.'
           : '이 기기용 코드가 아닙니다. 기기 ID를 다시 확인해 관리자에게 요청하세요.', 'err');
  };
  /* 잠금 화면이 열린 상태에서 활성화 링크를 누른 경우 (주소의 # 부분만 바뀌어 새로고침되지 않음) */
  const onHash = () => {
    const hm = location.hash.match(/[#&]license=([^&]+)/);
    if (!hm || !document.getElementById('lk_code')) return;
    $('lk_code').value = decodeURIComponent(hm[1]);
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
    $('lk_ok').click();
    if (!document.getElementById('lock')) window.removeEventListener('hashchange', onHash);
  };
  window.addEventListener('hashchange', onHash);
}

licenseGate().then(() => {
  build();
  updateProgress();
  renderAllPhotos();
  const li = document.getElementById('licinfo');
  if (li && LIC_INFO) li.textContent = '라이선스: ' + (LIC_INFO.name || '등록됨') + ' · 만료 ' + LIC.fmtExp(LIC_INFO.exp) + ' · 기기 ID ' + LIC.fmtId(LIC_DEV);
});
</script>
